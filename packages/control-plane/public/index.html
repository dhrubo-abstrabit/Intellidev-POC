<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intellidev · dispatch</title>
    <!--
      Design tokens lifted from Intellidev.html, the existing UI build. Same names, same
      values, both themes — so when the real UI takes over there is nothing to reconcile.
      Fonts fall back to system faces: Manrope and JetBrains Mono are not vendored here.
    -->
    <style>
      :root {
        --app: #ffffff;
        --main: #ffffff;
        --panel: #fafbfa;
        --card: #ffffff;
        --inset: #f5f7f5;
        --field: #f5f7f5;
        --input: #f2f5f2;
        --chip: #f2f5f2;
        --hover: #f1f4f1;
        --active: #e9f1eb;
        --btn2: #f0f4f1;
        --btn2h: #e4ece7;
        --bd-soft: #e9ede9;
        --bd-strong: #ccd5ce;
        --bd-hover: #a5b6aa;
        --bd-input: #d8dfd9;
        --bd-danger: #f0c8c4;
        --bd-warn: #e9d9a6;
        --fg: #10201a;
        --fg2: #31403a;
        --fg3: #56655d;
        --fg4: #697870;
        --green: #12915a;
        --green2: #0f7a4b;
        --green-bd: #2f7d4f;
        --on-green: #ffffff;
        --amber: #b06a08;
        --blue: #2563eb;
        --red: #d13b3b;
        --sans: Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      :root[data-theme='dark'] {
        --app: #0d100e;
        --main: #0c100e;
        --panel: #0e1210;
        --card: #121614;
        --inset: #0f1311;
        --field: #161a18;
        --input: #141816;
        --chip: #171c19;
        --hover: #191e1b;
        --active: #1a211d;
        --btn2: #1f2724;
        --btn2h: #28332e;
        --bd-soft: #1d2320;
        --bd-strong: #2a302c;
        --bd-hover: #3a463f;
        --bd-input: #262d29;
        --bd-danger: #3d2725;
        --bd-warn: #3a3524;
        --fg: #e6ece8;
        --fg2: #c6d0ca;
        --fg3: #9aa8a1;
        --fg4: #7f8a84;
        --green: #4ade80;
        --green2: #7dd3a0;
        --green-bd: #3d9a63;
        --on-green: #06210f;
        --amber: #f59e0b;
        --blue: #4c8dff;
        --red: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--app);
        color: var(--fg);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--bd-soft);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      header h1 {
        font-size: 15px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      header .spacer {
        flex: 1;
      }
      .meta {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--fg4);
      }
      .layout {
        display: grid;
        grid-template-columns: 380px minmax(0, 1fr);
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
      .side {
        border-right: 1px solid var(--bd-soft);
        background: var(--panel);
        padding: 16px;
      }
      /*
       * The sidebar scrolls itself, and only where there is a sidebar to scroll.
       *
       * Without this the panel simply grows: a project with a dozen stages made the whole page
       * taller than the screen, so reaching the task list meant scrolling past the editor and
       * the run detail on the right scrolled away with it. Under 900px the layout is one column
       * and the page scroll is the right one, so this is scoped to the two-column case.
       */
      /*
       * Two panes that scroll themselves, sized without guessing at the header.
       *
       * `calc(100vh - 53px)` was here before and the header is 70px, so the page overflowed by
       * exactly the difference — and would break again the next time the header changed. A flex
       * column measures it instead: the header takes what it needs, the layout takes the rest.
       *
       * Only above 900px. Below that the layout is a single column and the page scroll is the
       * right one; fixing the height there would put content below the fold with nothing to
       * scroll it.
       */
      @media (min-width: 901px) {
        body {
          display: flex;
          flex-direction: column;
          height: 100vh;
          overflow: hidden;
        }
        header {
          flex: none;
        }
        .layout {
          flex: 1;
          min-height: 0;
        }
        .side,
        .main {
          overflow-y: auto;
          min-height: 0;
        }
      }
      .main {
        padding: 16px 20px;
        min-width: 0;
      }
      h2 {
        font-family: var(--mono);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.11em;
        color: var(--fg3);
        margin: 0 0 10px;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--fg3);
        margin: 10px 0 4px;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 8px 10px;
        font: inherit;
        color: var(--fg);
        background: var(--input);
        border: 1px solid var(--bd-input);
        border-radius: 6px;
      }
      /*
       * A checkbox is not a text field.
       *
       * The rule above was written when every input on the page was one, so `width: 100%` was
       * harmless. The first checkbox added made itself the full width of its row and left the
       * label beside it zero pixels wide — which rendered as a sentence one word per line, two
       * hundred pixels tall.
       */
      input[type='checkbox'],
      input[type='radio'] {
        width: auto;
        padding: 0;
        accent-color: var(--ok, #2f7d4f);
      }
      textarea {
        min-height: 64px;
        resize: vertical;
        font-family: inherit;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: 2px solid var(--green-bd);
        outline-offset: 1px;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 9px 14px;
        border-radius: 6px;
        cursor: pointer;
        background: var(--green);
        color: var(--on-green);
        border: 1px solid var(--green-bd);
      }
      button:hover:not(:disabled) {
        background: var(--green2);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.secondary {
        background: var(--btn2);
        color: var(--fg);
        border-color: var(--bd-strong);
      }
      button.secondary:hover:not(:disabled) {
        background: var(--btn2h);
      }
      /*
        `hidden` has to win.

        The attribute's `display: none` comes from the user-agent stylesheet, so any class that
        sets `display` beats it — and the classes here nearly all do. That is why the template
        picker and the default checkbox stayed on screen in a mode that hides them: the code was
        setting `.hidden = true` and the CSS was quietly ignoring it.
      */
      [hidden] {
        display: none !important;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        flex: none;
      }
      .dot.ok {
        background: var(--green);
      }
      .dot.unauthorized {
        background: var(--amber);
      }
      .dot.error {
        background: var(--red);
      }
      .dot.unknown {
        background: var(--fg5);
      }
      .srv {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 8px 0;
        border-bottom: 1px solid var(--bd-soft);
      }
      .srv:last-child {
        border-bottom: 0;
      }
      /*
       * A stage card, which is emphatically not a `.srv`.
       *
       * `.srv` is `display: flex`, so reusing it turned every child — the controls, the prompt,
       * the approval label — into a column squeezed beside its siblings. Stacked instead, with
       * the controls laid out on a grid so each has a real width rather than whatever flex
       * leaves it.
       */
      /*
       * The stage editor as a dialog rather than a column in the sidebar.
       *
       * Editing a pipeline is a task in its own right — several stages, each with a prompt worth
       * reading — and doing it in a 380px column meant a textarea the width of a phone under a
       * list that pushed everything else off screen. A dialog gets the width the work needs and
       * leaves the page underneath alone.
       */
      dialog.sheet {
        width: min(760px, 92vw);
        max-height: 86vh;
        padding: 0;
        border: 1px solid var(--bd-soft);
        border-radius: 14px;
        background: var(--panel);
        color: var(--fg);
      }
      dialog.sheet::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }
      .sheet-head,
      .sheet-foot {
        position: sticky;
        padding: 14px 18px;
        background: var(--panel);
        z-index: 1;
      }
      .sheet-head {
        top: 0;
        border-bottom: 1px solid var(--bd-soft);
      }
      .sheet-foot {
        bottom: 0;
        border-top: 1px solid var(--bd-soft);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      /* Only the middle scrolls, so the title and the buttons stay put. */
      .sheet-body {
        padding: 14px 18px;
        overflow-y: auto;
        max-height: calc(86vh - 130px);
      }
      .stage {
        display: block;
        padding: 10px 0;
        border-bottom: 1px solid var(--bd-soft);
      }
      .stage:last-child {
        border-bottom: 0;
      }
      .stage-head {
        display: grid;
        /* grip, number, id, kind, the on switch, remove. `minmax(0, …)` so a long id shrinks
           rather than pushing the controls off the edge. The kind column is wide enough for
           "builtin" plus a native dropdown arrow — at 5.5em it read "age" and "bui", which is
           not a choice anyone can make. */
        grid-template-columns: auto 1.4em minmax(0, 1fr) 8.5em auto auto;
        gap: 6px;
        align-items: center;
      }
      .stage-head input,
      .stage-head select {
        min-width: 0;
      }
      .grip {
        cursor: grab;
        /* Tight tracking so two dots read as a grip rather than as four characters. */
        letter-spacing: -2px;
        padding-inline: 6px;
      }
      .stage[draggable='true'] {
        /* The row moves, the text inside it does not get selected on the way. */
        user-select: none;
      }
      .stage.dragging {
        opacity: 0.4;
      }
      /* Where the row would land. A line rather than a gap, so nothing reflows mid-drag and the
         target stops moving away from the cursor. */
      .stage.drop-before {
        box-shadow: inset 0 3px 0 0 var(--green);
      }
      .stage.drop-after {
        box-shadow: inset 0 -3px 0 0 var(--green);
      }
      /* A stage that will be skipped. Legible, but plainly not part of the run. */
      .stage.off > *:not(.stage-head) {
        opacity: 0.4;
      }
      .stage.off .stage-head input[data-stage-id],
      .stage.off .stage-head select {
        opacity: 0.55;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }
      .toggle input {
        width: auto;
      }
      .stage .icon {
        padding: 4px 7px;
        line-height: 1;
      }
      .stage textarea {
        width: 100%;
        margin-top: 6px;
        resize: vertical;
      }
      /* The checkbox sits with its label rather than beside it in a flex column. */
      .stage .approval {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        margin-top: 8px;
        line-height: 1.4;
      }
      .stage .approval input {
        margin-top: 2px;
        flex: none;
      }
      /*
       * The label text fills the row rather than shrinking to its longest word.
       *
       * A flex item sizes to its content and may shrink below it, which put this sentence in a
       * 53px column two hundred pixels tall — the tall thin text in the screenshot. `flex: 1`
       * makes it take the space that is actually there.
       */
      .stage .approval span {
        flex: 1;
        min-width: 0;
      }
      .srv .grow {
        flex: 1;
        min-width: 0;
      }
      .srv .name {
        font-weight: 600;
        font-size: 13px;
      }
      .srv .meta {
        color: var(--fg3);
        font-size: 12px;
        margin: 2px 0 0;
        overflow-wrap: anywhere;
      }
      .srv button {
        padding: 3px 8px;
        font-size: 12px;
        font-weight: 500;
      }
      .checks label {
        display: flex;
        gap: 7px;
        align-items: center;
        font-weight: 400;
        margin: 0 0 5px;
        text-transform: none;
        letter-spacing: 0;
        font-size: 13px;
        color: var(--fg);
      }
      .checks input {
        width: auto;
        margin: 0;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd-soft);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 8px;
      }
      .task {
        cursor: pointer;
      }
      .task:hover {
        border-color: var(--bd-hover);
        background: var(--hover);
      }
      .task.selected {
        border-color: var(--green-bd);
        background: var(--active);
      }
      .task h3 {
        margin: 0 0 4px;
        font-size: 13px;
        font-weight: 600;
      }
      .task p {
        margin: 0;
        font-size: 12px;
        color: var(--fg3);
      }
      /* State is encoded in form as well as colour: a pill plus a dot, so it reads without
         relying on hue alone. */
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--chip);
        border: 1px solid var(--bd-strong);
        color: var(--fg3);
      }
      .pill::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .pill.running,
      .pill.dispatched,
      .pill.provisioning {
        color: var(--green);
        border-color: var(--green-bd);
      }
      .pill.succeeded,
      .pill.in_review,
      .pill.done {
        color: var(--green);
        border-color: var(--green-bd);
      }
      .pill.failed,
      .pill.blocked {
        color: var(--red);
        border-color: var(--bd-danger);
      }
      .pill.waiting_capacity,
      .pill.parked {
        color: var(--amber);
        border-color: var(--bd-warn);
      }
      .stages {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 10px 0;
      }
      .stage {
        font-family: var(--mono);
        font-size: 11px;
        padding: 3px 9px;
        border-radius: 5px;
        background: var(--inset);
        border: 1px solid var(--bd-soft);
        color: var(--fg4);
      }
      .stage.active {
        border-color: var(--green-bd);
        color: var(--green);
        background: var(--active);
      }
      .stage.passed {
        color: var(--green);
        border-color: var(--green-bd);
      }
      .stage.failed {
        color: var(--red);
        border-color: var(--bd-danger);
      }
      #log {
        font-family: var(--mono);
        font-size: 11.5px;
        line-height: 1.65;
        background: var(--inset);
        border: 1px solid var(--bd-soft);
        border-radius: 8px;
        padding: 10px 12px;
        height: calc(100vh - 320px);
        min-height: 240px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #log .seq {
        color: var(--fg4);
      }
      #log .st {
        color: var(--blue);
      }
      #log .ok {
        color: var(--green);
      }
      #log .bad {
        color: var(--red);
      }
      #log .warn {
        color: var(--amber);
      }
      .empty {
        color: var(--fg4);
        font-size: 13px;
        padding: 20px 0;
      }
      a {
        color: var(--green);
      }
      .hint {
        font-size: 11px;
        color: var(--fg4);
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Intellidev</h1>
      <span class="pill" id="mode">…</span>
      <div class="spacer"></div>
      <span class="meta" id="cfg"></span>
      <button class="secondary" id="theme" title="Toggle theme">◐</button>
    </header>

    <div class="layout">
      <section class="side">
        <h2>New task</h2>
        <form id="form">
          <label for="repoUrl">Repository</label>
          <input
            id="repoUrl"
            required
            placeholder="/path/to/origin.git or https://github.com/me/repo"
          />
          <label for="title">Title</label>
          <input id="title" required placeholder="Add a hello function" />
          <label for="description">Description</label>
          <textarea id="description" required placeholder="What should change, and why."></textarea>
          <label for="criteria">Acceptance criteria (one per line)</label>
          <textarea id="criteria" placeholder="hello('world') returns a greeting"></textarea>
          <label for="harness">Harness</label>
          <select id="harness"></select>
          <label for="baseBranch">Base branch</label>
          <input id="baseBranch" value="main" />

          <!--
            Which saved template this task starts from.

            The API accepted `stageTemplateId` from the beginning and nothing here ever sent one,
            so every task ran the project default whether or not other templates existed — they
            were savable and then unreachable.
          -->
          <label for="taskTemplate">Stages</label>
          <select id="taskTemplate"></select>

          <label>Tools</label>
          <div id="taskServers"><p class="hint">No MCP servers connected yet.</p></div>

          <div class="row" style="margin-top: 14px">
            <button type="submit" id="create">Create task</button>
          </div>
          <p class="hint" id="formHint"></p>
        </form>

        <h2 style="margin-top: 22px">Harness accounts</h2>
        <div id="seats"><p class="empty">No harness connected.</p></div>

        <div id="loginPanel" class="card" hidden style="margin-top: 8px">
          <div class="name" id="loginTitle"></div>
          <p class="hint" id="loginHint"></p>
          <!--
            The device code, when there is one. Shown large because its whole job is to be read
            off this screen and typed into another window — a hint-sized line is the wrong shape
            for that, and it was previously buried in one.
          -->
          <div
            id="loginCodeShown"
            hidden
            style="
              margin: 10px 0;
              padding: 12px;
              border: 1px solid var(--line);
              border-radius: 10px;
              text-align: center;
            "
          >
            <div class="hint" style="margin-bottom: 4px">Enter this code on that page</div>
            <div
              id="loginUserCode"
              style="
                font:
                  600 22px/1.2 ui-monospace,
                  monospace;
                letter-spacing: 2px;
              "
            ></div>
          </div>
          <p style="margin: 8px 0">
            <a id="loginLink" target="_blank" rel="noopener noreferrer"></a>
          </p>
          <div id="loginCodeRow" hidden>
            <label for="loginCode">Code from that page</label>
            <div class="row" style="gap: 6px">
              <input id="loginCode" placeholder="paste it here" style="flex: 1" />
              <!--
                One click instead of click-then-paste. The clipboard read needs a gesture and a
                permission, and is allowed to be refused — the field beside it still works, so
                nothing depends on this button succeeding.
              -->
              <button type="button" id="loginPaste" class="secondary" title="Paste from clipboard">
                Paste
              </button>
            </div>
            <!-- Says whether what was pasted is usable, before anything is submitted. -->
            <p class="hint" id="loginCodeState" style="min-height: 1.2em"></p>
          </div>
          <div class="row" style="margin-top: 10px">
            <button type="button" id="loginSubmit" hidden>Submit code</button>
            <button type="button" id="loginCancel" class="secondary">Cancel</button>
          </div>
          <p class="hint" id="loginStatus"></p>
        </div>

        <h2 style="margin-top: 22px">
          Stages
          <button id="openStages" class="secondary" style="float: right; padding: 4px 10px">
            Configure
          </button>
        </h2>
        <!--
          A summary here, the editing in a dialog. The sidebar's job is to say what will happen;
          changing it is a piece of work that needs room.
        -->
        <p class="hint" id="stagesSource"></p>
        <p class="hint" id="stagesSummary"></p>

        <h2 style="margin-top: 22px">
          MCP servers
          <button id="addServer" class="secondary" style="float: right; padding: 4px 10px">
            Add
          </button>
        </h2>
        <div id="servers"><p class="empty">Nothing connected.</p></div>

        <form id="serverForm" hidden>
          <label for="sPreset">Preset</label>
          <select id="sPreset"></select>
          <label for="sId">Server id</label>
          <input id="sId" placeholder="supabase" />
          <label for="sName">Display name</label>
          <input id="sName" placeholder="Supabase" />
          <label for="sUrl">URL</label>
          <input id="sUrl" placeholder="https://mcp.supabase.com/mcp" />
          <label for="sAuth">Auth</label>
          <select id="sAuth">
            <option value="oauth2">OAuth (opens a consent window)</option>
            <option value="bearer">Bearer token</option>
            <option value="none">None</option>
          </select>
          <div id="sTokenRow" hidden>
            <label for="sToken">Bearer token</label>
            <input
              id="sToken"
              type="password"
              placeholder="stored locally, never sent to the agent"
            />
          </div>
          <div id="sScopeRow">
            <label for="sScope">Scopes (space separated)</label>
            <input id="sScope" placeholder="leave blank for everything the server offers" />
          </div>
          <p class="hint" id="sHint"></p>
          <div class="row" style="margin-top: 10px">
            <button type="submit" id="saveServer">Save &amp; connect</button>
            <button type="button" id="cancelServer" class="secondary">Cancel</button>
          </div>
          <p class="hint" id="serverHint"></p>
        </form>

        <h2 style="margin-top: 22px">Tasks</h2>
        <div id="tasks"><p class="empty">No tasks yet.</p></div>
      </section>

      <section class="main">
        <div id="detail"><p class="empty">Select a task, or create one.</p></div>
      </section>
    </div>

    <dialog class="sheet" id="stagesDialog">
      <div class="sheet-head">
        <div class="name" id="stagesTitle">Stages</div>
        <p class="hint" id="stagesScopeNote" style="margin: 4px 0 0"></p>
        <!--
          Which of the saved templates is open.

          Without this the editor could only ever reach one: saving wrote the project default, so
          a second template could be created and then never opened again.
        -->
        <div class="row" id="templatePickerRow" style="margin-top: 8px; gap: 6px">
          <label class="hint" for="templatePicker" style="white-space: nowrap">Editing</label>
          <select id="templatePicker" style="flex: 1"></select>
          <button type="button" id="deleteTemplate" class="secondary">Delete</button>
        </div>
      </div>
      <div class="sheet-body">
        <div id="stageList"></div>
        <button type="button" id="addStage" class="secondary" style="margin-top: 10px">
          Add stage
        </button>
      </div>
      <div class="sheet-foot">
        <!-- Label and field together, so hiding the field cannot leave its label behind. -->
        <div class="row" id="stageTemplateNameRow" style="flex: 1">
          <label class="hint" for="stageTemplateName" style="white-space: nowrap">Save as</label>
          <input
            id="stageTemplateName"
            placeholder="a name for this set of stages"
            style="flex: 1"
          />
        </div>
        <!--
          Whether saving also claims the project default.

          It used to be unconditional, so saving a second template would silently take the
          default off the first — the one thing that changes what every future task runs, done
          as a side effect of pressing Save.
        -->
        <label class="hint approval" id="makeDefaultRow" style="white-space: nowrap">
          <input type="checkbox" id="makeDefault" />
          <span>the project default</span>
        </label>
        <button type="button" id="saveStages">Save</button>
        <button type="button" id="closeStages" class="secondary">Close</button>
        <span class="hint" id="stagesStatus"></span>
      </div>
    </dialog>

    <script type="module">
      const $ = (id) => document.getElementById(id)

      /**
       * Sign in, and make every later request carry the token.
       *
       * `fetch` is wrapped once rather than the twenty call sites being edited, because the
       * failure mode of missing one is a 401 that reads as a broken feature rather than as a
       * missing header — which is exactly what happened when the gate was added and this page
       * had no login at all.
       *
       * The token lives in `sessionStorage`, not `localStorage`: it is a bearer credential, and
       * a tab closing should end the session rather than leave it on disk indefinitely.
       */
      const auth = await (await fetch('/auth-config')).json()

      const TOKEN_KEY = 'intellidev.token'
      const nativeFetch = window.fetch.bind(window)

      window.fetch = async (input, init = {}) => {
        const url = String(typeof input === 'string' ? input : (input.url ?? ''))
        const token = sessionStorage.getItem(TOKEN_KEY)
        // Only our own API, and never the ungated config route — sending a stale token to
        // Supabase's own endpoints would be wrong, and to /auth-config pointless.
        const ours = url.startsWith('/api/') || url.startsWith('/internal/')
        const res = await nativeFetch(input, {
          ...init,
          headers: {
            ...(init.headers ?? {}),
            ...(ours && token ? { authorization: `Bearer ${token}` } : {}),
          },
        })
        if (res.status === 401 && ours) {
          // The token expired mid-session. Signing in again is the only remedy, so ask rather
          // than let every panel render empty.
          sessionStorage.removeItem(TOKEN_KEY)
          location.reload()
        }
        return res
      }

      // Named for what it signs into. The page already has a `signIn(harness, button)` that
      // starts a harness login, and the collision made the whole module fail to parse — so
      // nothing ran, and the symptom was every panel rendering empty.
      async function signInToSupabase(email, password) {
        const res = await nativeFetch(`${auth.supabaseUrl}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: { apikey: auth.supabaseAnonKey, 'content-type': 'application/json' },
          body: JSON.stringify({ email, password }),
        })
        if (!res.ok) {
          const body = await res.json().catch(() => ({}))
          throw new Error(body.error_description ?? body.msg ?? 'sign-in failed')
        }
        const { access_token } = await res.json()
        sessionStorage.setItem(TOKEN_KEY, access_token)
      }

      /**
       * Blocks the page until there is a token.
       *
       * A form drawn here rather than a separate route, so the whole app stays one file and the
       * rest of the script can assume it is authenticated by the time it runs.
       */
      async function requireSignIn() {
        if (!auth.required) return
        // Verify a stored token rather than trusting it: an expired one would otherwise let the
        // page render and then fail every panel with a 401.
        if (sessionStorage.getItem(TOKEN_KEY)) {
          const probe = await fetch('/api/config')
          if (probe.ok) return
          sessionStorage.removeItem(TOKEN_KEY)
        }

        document.body.innerHTML = `
          <div style="max-width:22rem;margin:6rem auto;font:14px system-ui">
            <h1 style="font-size:1.1rem;margin-bottom:.25rem">Intellidev</h1>
            <p style="color:#888;margin-top:0">Sign in to continue.</p>
            <form id="signin" style="display:grid;gap:.6rem;margin-top:1.25rem">
              <input id="email" type="email" placeholder="email" autocomplete="username"
                     required style="padding:.55rem;border:1px solid #ccc;border-radius:6px" />
              <input id="password" type="password" placeholder="password"
                     autocomplete="current-password" required
                     style="padding:.55rem;border:1px solid #ccc;border-radius:6px" />
              <button type="submit"
                      style="padding:.55rem;border:0;border-radius:6px;background:#2f7d4f;color:#fff;cursor:pointer">
                Sign in
              </button>
              <p id="err" style="color:#c33;min-height:1.2em;margin:0"></p>
            </form>
          </div>`

        await new Promise((resolve) => {
          $('signin').onsubmit = async (event) => {
            event.preventDefault()
            $('err').textContent = ''
            try {
              await signInToSupabase($('email').value, $('password').value)
              resolve()
            } catch (error) {
              $('err').textContent = String(error.message ?? error)
            }
          }
        })
        // Reload rather than re-render: the rest of this script has already run against a page
        // that no longer exists, and re-entering it by hand is how half-initialised state bugs
        // start.
        location.reload()
      }

      await requireSignIn()
      const state = {
        tasks: [],
        selected: null,
        run: null,
        stream: null,
        lastSeq: -1,
        servers: [],
        presets: [],
        accounts: [],
        recipes: [],
        config: null,
      }

      // --- theme ---------------------------------------------------------------
      $('theme').onclick = () => {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'
        document.documentElement.dataset.theme = next
        localStorage.setItem('theme', next)
      }
      document.documentElement.dataset.theme = localStorage.getItem('theme') ?? 'dark'

      // --- boot ----------------------------------------------------------------
      const config = await (await fetch('/api/config')).json()
      $('mode').textContent = config.mode
      $('mode').className = 'pill ' + (config.mode === 'docker' ? 'running' : '')
      $('cfg').textContent =
        `${config.image} · ${config.hasGithubToken ? 'github token set' : 'no github token'}`
      $('harness').innerHTML = config.harnesses
        .map((h) => `<option ${h === 'opencode' ? 'selected' : ''}>${h}</option>`)
        .join('')

      // --- tasks ---------------------------------------------------------------
      async function loadTasks() {
        state.tasks = (await (await fetch('/api/tasks')).json()).tasks
        $('tasks').innerHTML =
          state.tasks.length === 0
            ? '<p class="empty">No tasks yet.</p>'
            : state.tasks
                .map(
                  (t) => `
          <div class="card task ${state.selected === t.id ? 'selected' : ''}" data-id="${t.id}">
            <div class="row" style="justify-content: space-between">
              <h3>${escape(t.title)}</h3>
              <span class="pill ${t.status}">${t.status.replace(/_/g, ' ')}</span>
            </div>
            <p>${escape(t.harness)} · ${escape(t.repoUrl.split('/').slice(-1)[0])}${t.mcpServerIds?.length ? ` · ${escape(t.mcpServerIds.join(', '))}` : ''}</p>
          </div>`,
                )
                .join('')
        for (const el of $('tasks').querySelectorAll('.task')) {
          el.onclick = () => select(el.dataset.id)
        }
      }

      // --- harness accounts ----------------------------------------------------

      async function loadSeats() {
        const [accounts, recipes, config] = await Promise.all([
          fetch('/api/harness/accounts').then((r) => r.json()),
          state.recipes.length
            ? { recipes: state.recipes }
            : fetch('/api/harness/recipes').then((r) => r.json()),
          fetch('/api/config').then((r) => r.json()),
        ])
        state.accounts = accounts.accounts
        state.recipes = recipes.recipes
        state.config = config
        renderSeats()
      }

      function renderSeats() {
        // Every harness is listed, connected or not: a missing credential is the thing worth
        // seeing, since without it a run reaches the model layer and reports "Not logged in".
        $('seats').innerHTML = state.recipes
          .map((r) => {
            const account = state.accounts.find((a) => a.harness === r.harness)
            const viaEnv = !account && state.config?.harnessAuth?.[r.harness]
            // A stored seat whose material cannot be decrypted is not connected, whatever the
            // row says. It showed green until a run failed, which is the worst place to learn it.
            const broken = Boolean(account) && account.readable === false
            const ok = (Boolean(account) && !broken) || viaEnv
            const detail = broken
              ? 'stored credential cannot be read — sign in again'
              : account
                ? account.envVars.length
                  ? account.envVars.join(', ')
                  : account.files.join(', ')
                : viaEnv
                  ? 'from the control plane environment'
                  : `run: ${r.command}`
            return `
              <div class="srv">
                <span class="dot ${ok ? 'ok' : 'unknown'}"></span>
                <div class="grow">
                  <div class="name">${escape(r.harness)}</div>
                  <p class="meta">${escape(detail)}</p>
                </div>
                ${
                  r.canSignIn
                    ? `<button class="secondary" data-signin="${escape(r.harness)}">${account ? 'Sign in again' : 'Sign in'}</button>`
                    : `<button class="secondary" data-import="${escape(r.harness)}">${account ? 'Re-import' : 'Import'}</button>`
                }
                ${account ? `<button class="secondary" data-forget="${escape(r.harness)}" title="Forget">×</button>` : ''}
              </div>`
          })
          .join('')

        $('seats')
          .querySelectorAll('[data-import]')
          .forEach((b) => {
            b.onclick = async () => {
              const harness = b.dataset.import
              const recipe = state.recipes.find((r) => r.harness === harness)
              /**
               * A file picker, not a path prompt.
               *
               * A path is only meaningful when the control plane shares a filesystem with the
               * person at the keyboard. Hosted, it reads a container's disk and finds nothing —
               * so the browser reads the file and uploads what it contains instead, which is the
               * form that works in both places.
               */
              const input = document.createElement('input')
              input.type = 'file'
              // A hint, not a restriction: these files have no consistent extension.
              input.accept = '.json,application/json'
              input.onchange = async () => {
                const file = input.files?.[0]
                if (!file) return
                b.disabled = true
                try {
                  await connectHarness({ harness, contents: await file.text() })
                } finally {
                  b.disabled = false
                }
              }
              // Told where to look, since the file is usually hidden in the home directory.
              b.title = `usually ${recipe.hostPath}`
              input.click()
            }
          })
        $('seats')
          .querySelectorAll('[data-signin]')
          .forEach((b) => {
            b.onclick = () => void signIn(b.dataset.signin, b)
          })
        $('seats')
          .querySelectorAll('[data-forget]')
          .forEach((b) => {
            b.onclick = async () => {
              await fetch(`/api/harness/accounts/${b.dataset.forget}`, { method: 'DELETE' })
              await loadSeats()
            }
          })
      }

      /**
       * Drive the harness's own login: open the vendor's page, relay what comes back.
       *
       * A window is opened *synchronously on the click*, while the gesture that permits it is
       * still in scope, and navigated once the control plane has scraped the URL. Opening it
       * later — after the await — is what browsers block, which is why this was an anchor
       * before.
       *
       * The anchor is still rendered, and is what happens when a blocker refuses the window
       * anyway: `window.open` returns null, and the flow continues with a link the person can
       * click. Nothing depends on the popup existing.
       */
      async function signIn(harness, button) {
        button.disabled = true
        /**
         * Opened blank on the click, navigated once the URL is known.
         *
         * FOUND BY CLICKING IT. This asked for `noopener` too, and `window.open` returns **null**
         * whenever that is set — by specification, since there is no handle to give back. So the
         * window opened, stayed `about:blank`, and nothing could ever navigate it.
         *
         * A handle is the whole point here, so `noopener` cannot be used. The page it will hold
         * is the vendor's own sign-in, and the anchor below keeps `rel="noopener"` for the case
         * where a person clicks that instead.
         */
        const authWindow = window.open('', '_blank', 'width=520,height=720')
        /**
         * Say something while it is blank.
         *
         * The window is opened on the click and navigated once the URL is known, which is
         * instant for a direct sign-in and about a minute when a container has to start. A blank
         * window for a minute reads as a broken popup, and the person closes it — so it holds a
         * line of text until it has somewhere to go.
         */
        try {
          authWindow?.document.write(
            '<title>Signing in…</title>' +
              '<body style="font:14px system-ui;display:grid;place-items:center;height:90vh;' +
              'margin:0;color:#555">Preparing the sign-in page…</body>',
          )
        } catch {
          /* a blocker took it; the link in the panel still works */
        }
        const panel = $('loginPanel')
        panel.hidden = false
        $('loginTitle').textContent = `Sign in to ${harness}`
        $('loginHint').textContent = 'starting the login…'
        $('loginLink').textContent = ''
        $('loginLink').removeAttribute('href')
        $('loginCodeRow').hidden = true
        $('loginCodeShown').hidden = true
        $('loginSubmit').hidden = true
        $('loginStatus').textContent = ''

        try {
          const res = await fetch(`/api/harness/login/${harness}/start`, { method: 'POST' })
          const body = await res.json()
          const login = body.login
          if (!res.ok || !login?.authorizationUrl) {
            $('loginHint').textContent = body.error ?? login?.error ?? 'could not start the login'
            // Otherwise a blank tab is left sitting there with no explanation.
            try {
              authWindow?.close()
            } catch {
              /* already gone */
            }
            return
          }

          $('loginLink').href = login.authorizationUrl
          $('loginLink').textContent = 'Open the sign-in page ↗'
          // Navigated now that the URL exists. A blocked or closed window is not an error:
          // the link above does the same job.
          try {
            if (authWindow && !authWindow.closed) authWindow.location.href = login.authorizationUrl
          } catch {
            /* a blocker took it; the link stands */
          }
          // The code gets its own box; the hint explains what to do with it.
          $('loginCodeShown').hidden = !login.userCode
          $('loginUserCode').textContent = login.userCode ?? ''
          $('loginHint').textContent = login.inputHint
            ? login.inputHint
            : login.needsCode
              ? 'Sign in, then paste the code that page shows you.'
              : 'Sign in; this page will notice when it completes.'
          $('loginCodeRow').hidden = !login.needsCode
          $('loginSubmit').hidden = !login.needsCode

          $('loginStatus').textContent = 'waiting for you to finish…'
          const settled = await waitForLogin()
          $('loginStatus').textContent =
            settled?.status === 'connected'
              ? 'connected'
              : (settled?.error ?? 'the login did not complete')
          if (settled?.status === 'connected') panel.hidden = true
        } finally {
          button.disabled = false
          await loadSeats()
        }
      }

      /**
       * Is this paste usable, and what is the code inside it?
       *
       * Mirrors the control plane's own extraction so the answer appears as the person pastes
       * rather than after a round trip. Codex sends them back with a whole failed URL — the code
       * is a parameter inside it — and Claude with `code#state`.
       */
      function readPastedCode(raw) {
        const text = (raw ?? '').trim()
        if (!text) return { ok: false }
        if (/^https?:\/\//.test(text)) {
          try {
            const code = new URL(text).searchParams.get('code')
            return code ? { ok: true, code } : { ok: false, why: 'that address has no code in it' }
          } catch {
            return { ok: false, why: 'that does not look like an address' }
          }
        }
        return { ok: true, code: text.split('#')[0] }
      }

      /** Submits whatever is in the box, and reports what came back. */
      async function submitLoginCode() {
        const parsed = readPastedCode($('loginCode').value)
        if (!parsed.ok) return
        $('loginSubmit').disabled = true
        const res = await fetch('/api/harness/login/code', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ code: $('loginCode').value.trim() }),
        })
        $('loginSubmit').disabled = false
        $('loginCode').value = ''
        $('loginCodeState').textContent = ''
        $('loginStatus').textContent = res.ok
          ? 'finishing…'
          : ((await res.json()).error ?? 'code rejected')
      }

      /**
       * Validates as it is typed or pasted, and submits itself once it is valid.
       *
       * The last step of a sign-in should not be a form. Everything needed is in what they
       * pasted, so asking them to then find a button is asking for a click that carries no
       * information.
       */
      $('loginCode').oninput = () => {
        const parsed = readPastedCode($('loginCode').value)
        $('loginCodeState').textContent = parsed.ok
          ? 'code found — signing in…'
          : (parsed.why ?? '')
        $('loginCodeState').style.color = parsed.ok ? 'var(--ok, #2f7d4f)' : 'var(--fg3)'
        if (parsed.ok) void submitLoginCode()
      }

      $('loginPaste').onclick = async () => {
        try {
          $('loginCode').value = await navigator.clipboard.readText()
          $('loginCode').dispatchEvent(new Event('input'))
        } catch {
          // Refused, or unsupported. The field beside it is the fallback, and always was.
          $('loginCodeState').textContent = 'could not read the clipboard — paste into the box'
        }
      }

      $('loginSubmit').onclick = async () => {
        const code = $('loginCode').value.trim()
        if (!code) return
        $('loginSubmit').disabled = true
        const res = await fetch('/api/harness/login/code', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ code }),
        })
        $('loginSubmit').disabled = false
        $('loginCode').value = ''
        if (!res.ok) $('loginStatus').textContent = (await res.json()).error ?? 'code rejected'
        else $('loginStatus').textContent = 'code sent; finishing…'
      }

      $('loginCancel').onclick = async () => {
        await fetch('/api/harness/login/cancel', { method: 'POST' })
        $('loginPanel').hidden = true
      }

      /** Poll until the CLI exits one way or the other. */
      async function waitForLogin() {
        for (let i = 0; i < 150; i++) {
          const { login } = await (await fetch('/api/harness/login/status')).json()
          if (!login || login.status === 'connected' || login.status === 'failed') return login
          await new Promise((r) => setTimeout(r, 2000))
        }
        return null
      }

      async function connectHarness(body) {
        const res = await fetch('/api/harness/accounts', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        })
        if (!res.ok) alert((await res.json()).error ?? 'could not connect')
        await loadSeats()
      }

      // --- mcp servers ---------------------------------------------------------

      async function loadServers() {
        const [servers, presets] = await Promise.all([
          fetch('/api/mcp/servers').then((r) => r.json()),
          state.presets.length
            ? { presets: state.presets }
            : fetch('/api/mcp/presets').then((r) => r.json()),
        ])
        state.servers = servers.servers
        state.presets = presets.presets
        renderServers()
        renderTaskServers()
      }

      function renderServers() {
        const el = $('servers')
        if (!state.servers.length) {
          el.innerHTML = '<p class="empty">Nothing connected.</p>'
          return
        }
        el.innerHTML = state.servers
          .map((s) => {
            // An authorized-but-unverified server is its own state: the token exists but no
            // tool list has been proven, so the button says Verify rather than Connect.
            const needsAuth = !s.authorized
            const label = needsAuth ? (s.auth === 'oauth2' ? 'Connect' : 'Add token') : 'Verify'
            const detail =
              s.health === 'ok'
                ? `${s.toolCount ?? 0} tools`
                : s.lastError
                  ? s.lastError.slice(0, 90)
                  : s.authorized
                    ? 'not verified yet'
                    : 'not connected'
            return `
              <div class="srv">
                <span class="dot ${s.health}" title="${escape(s.health)}"></span>
                <div class="grow">
                  <div class="name">${escape(s.name)} <span style="color:var(--fg4);font-weight:400">${escape(s.auth)}</span></div>
                  <p class="meta">${escape(detail)}</p>
                </div>
                <button class="secondary" data-connect="${escape(s.id)}">${label}</button>
                <button class="secondary" data-remove="${escape(s.id)}" title="Remove">×</button>
              </div>`
          })
          .join('')

        el.querySelectorAll('[data-connect]').forEach((b) => {
          b.onclick = () => connectServer(b.dataset.connect, b)
        })
        el.querySelectorAll('[data-remove]').forEach((b) => {
          b.onclick = async () => {
            await fetch(`/api/mcp/servers/${b.dataset.remove}`, { method: 'DELETE' })
            await loadServers()
          }
        })
      }

      async function connectServer(id, button) {
        const server = state.servers.find((s) => s.id === id)
        // A bearer server with no token yet has nothing to connect to; reopen the form so the
        // token can be supplied, rather than failing a verify that was always going to fail.
        if (server && server.auth === 'bearer' && !server.authorized) {
          openServerForm(server)
          return
        }
        button.disabled = true
        button.textContent = '…'
        try {
          const res = await fetch(`/api/mcp/servers/${id}/connect`, { method: 'POST' })
          const body = await res.json()
          if (!res.ok) {
            $('serverHint').textContent = body.error ?? 'could not connect'
          } else if (body.kind === 'oauth') {
            // A popup, not a redirect: the board keeps its state and the callback page can
            // tell this window when consent is done.
            window.open(body.authorizationUrl, 'intellidev-oauth', 'width=560,height=760')
          }
        } finally {
          await loadServers()
        }
      }

      // The callback page posts this when the exchange finishes.
      window.addEventListener('message', (event) => {
        if (event.data?.type === 'intellidev:mcp-connected') void loadServers()
      })

      function openServerForm(server) {
        $('serverForm').hidden = false
        $('addServer').hidden = true
        $('sPreset').innerHTML =
          '<option value="">Custom…</option>' +
          state.presets
            .map((p) => `<option value="${escape(p.id)}">${escape(p.name)}</option>`)
            .join('')
        $('sId').value = server?.id ?? ''
        $('sName').value = server?.name ?? ''
        $('sUrl').value = server?.url ?? ''
        $('sAuth').value = server?.auth ?? 'oauth2'
        $('sToken').value = ''
        $('sScope').value = ''
        $('sHint').textContent = ''
        $('serverHint').textContent = ''
        syncAuthRows()
      }

      function syncAuthRows() {
        const auth = $('sAuth').value
        $('sTokenRow').hidden = auth !== 'bearer'
        $('sScopeRow').hidden = auth !== 'oauth2'
      }
      $('sAuth').onchange = syncAuthRows

      $('sPreset').onchange = () => {
        const preset = state.presets.find((p) => p.id === $('sPreset').value)
        if (!preset) return
        $('sId').value = preset.id
        $('sName').value = preset.name
        $('sUrl').value = preset.url
        $('sAuth').value = preset.auth
        $('sScope').value = preset.scope ?? ''
        $('sHint').textContent = preset.hint
        syncAuthRows()
      }

      $('addServer').onclick = () => openServerForm(null)
      $('cancelServer').onclick = () => {
        $('serverForm').hidden = true
        $('addServer').hidden = false
      }

      $('serverForm').onsubmit = async (event) => {
        event.preventDefault()
        $('saveServer').disabled = true
        $('serverHint').textContent = ''
        const body = {
          id: $('sId').value.trim(),
          name: $('sName').value.trim() || $('sId').value.trim(),
          url: $('sUrl').value.trim(),
          auth: $('sAuth').value,
          ...($('sAuth').value === 'bearer' && $('sToken').value
            ? { token: $('sToken').value }
            : {}),
          ...($('sAuth').value === 'oauth2' && $('sScope').value.trim()
            ? { scope: $('sScope').value.trim() }
            : {}),
        }
        const res = await fetch('/api/mcp/servers', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        })
        $('saveServer').disabled = false
        if (!res.ok) {
          const error = await res.json()
          $('serverHint').textContent =
            (error.issues ?? []).map((i) => `${i.path.join('.')}: ${i.message}`).join('; ') ||
            error.error ||
            'could not save'
          return
        }
        $('serverForm').hidden = true
        $('addServer').hidden = false
        await loadServers()
        // Saving and connecting are one action: a server nobody connected is not useful, and
        // making it two clicks just invites forgetting the second.
        const row = $('servers').querySelector(`[data-connect="${body.id}"]`)
        if (row) await connectServer(body.id, row)
      }

      function renderTaskServers() {
        const usable = state.servers.filter((s) => s.authorized)
        const el = $('taskServers')
        if (!usable.length) {
          el.innerHTML =
            '<p class="hint">No MCP servers connected yet — add one above to give the agent tools.</p>'
          return
        }
        el.innerHTML =
          '<div class="checks">' +
          usable
            .map(
              (s) => `<label><input type="checkbox" class="taskServer" value="${escape(s.id)}" />
                 ${escape(s.name)} <span style="color:var(--fg4)">${s.toolCount ?? 0} tools</span></label>`,
            )
            .join('') +
          '</div>'
      }

      $('form').onsubmit = async (event) => {
        event.preventDefault()
        $('create').disabled = true
        $('formHint').textContent = ''
        const body = {
          repoUrl: $('repoUrl').value.trim(),
          title: $('title').value.trim(),
          description: $('description').value.trim(),
          acceptanceCriteria: $('criteria')
            .value.split('\n')
            .map((s) => s.trim())
            .filter(Boolean),
          harness: $('harness').value,
          baseBranch: $('baseBranch').value.trim() || 'main',
        }
        body.mcpServerIds = [...document.querySelectorAll('.taskServer:checked')].map(
          (c) => c.value,
        )
        /**
         * Only when one was chosen.
         *
         * An empty selection means "the project default", and resolution already answers that —
         * sending an empty string instead would fail the uuid check on a form nobody touched.
         */
        const chosenTemplate = $('taskTemplate').value
        if (chosenTemplate === CUSTOM_STAGES) {
          /**
           * The draft travels with the task, as stages rather than a template id.
           *
           * Which is what makes it a one-off: resolution takes inline stages over everything
           * else, no template is created, and a later edit to the project default leaves this
           * task alone.
           */
          if (!state.draftStages?.length) {
            $('create').disabled = false
            $('formHint').textContent = 'build the custom stages first, or pick a template'
            return
          }
          body.stages = state.draftStages
        } else if (chosenTemplate) {
          body.stageTemplateId = chosenTemplate
        }
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        })
        $('create').disabled = false
        if (!res.ok) {
          const error = await res.json()
          $('formHint').textContent =
            (error.issues ?? []).map((i) => `${i.path.join('.')}: ${i.message}`).join('; ') ||
            'could not create task'
          return
        }
        const { task } = await res.json()
        $('title').value = ''
        $('description').value = ''
        $('criteria').value = ''
        // The draft belonged to that task. Leaving it armed would silently apply a pipeline
        // built for one task to the next one somebody types.
        state.draftStages = null
        renderTaskTemplateOptions()
        $('taskTemplate').value = ''
        await loadTasks()
        select(task.id)
      }

      // --- detail --------------------------------------------------------------
      async function select(id) {
        state.selected = id
        state.run = null
        closeStream()
        await loadTasks()
        const { task, runs } = await (await fetch(`/api/tasks/${id}`)).json()
        renderDetail(task, runs)
        if (runs[0]) follow(runs[0].id)
      }

      function renderDetail(task, runs) {
        const run = runs[0]
        $('detail').innerHTML = `
          <div class="row" style="justify-content: space-between; align-items: flex-start">
            <div>
              <h2 style="margin-bottom: 6px">Task</h2>
              <div style="font-size: 16px; font-weight: 600">${escape(task.title)}</div>
              <p style="color: var(--fg3); margin: 6px 0 0; max-width: 60ch">${escape(task.description)}</p>
            </div>
            <div class="row">
              <span class="pill ${task.status}">${task.status.replace(/_/g, ' ')}</span>
              <!--
                Only before it runs. Editing the stages of a task that has already started would
                describe something that did not happen, and a resumed run reads its own state
                rather than the task.
              -->
              <button id="taskStages" class="secondary"
                ${task.status === 'not_started' || task.status === 'failed' ? '' : 'disabled'}>
                ${task.stages ? 'Stages (edited)' : 'Stages'}
              </button>
              <button id="dispatch" ${task.status === 'not_started' || task.status === 'failed' ? '' : 'disabled'}>
                Dispatch
              </button>
            </div>
          </div>
          <div class="stages" id="stages"></div>
          ${run?.prUrl ? `<p><a href="${run.prUrl}" target="_blank" rel="noreferrer">${run.prUrl}</a></p>` : ''}
          ${run?.failureReason ? `<p style="color: var(--red)">${escape(run.failureReason)}</p>` : ''}
          <h2 style="margin-top: 14px">Live log ${run ? `<span class="meta">· ${run.id}</span>` : ''}</h2>
          <div id="log">${run ? '' : 'Nothing dispatched yet.'}</div>
        `
        /**
         * The same dialog, pointed at one task.
         *
         * It opens on whatever the task will actually run — its own pinned stages if it has
         * them, the resolved template otherwise — so editing starts from the truth rather than
         * from a blank list. Saving pins them to this task alone.
         */
        $('taskStages').onclick = () => {
          state.stages = (task.stages ?? state.projectStages ?? []).map((stage) => ({ ...stage }))
          renderStages()
          openStageDialog({ taskId: task.id })
        }

        $('dispatch').onclick = async () => {
          $('dispatch').disabled = true
          $('log').textContent = ''
          const res = await fetch(`/api/tasks/${task.id}/dispatch`, { method: 'POST' })
          if (!res.ok) {
            append('bad', `dispatch failed: ${(await res.json()).error}`)
            return
          }
          const { runId } = await res.json()
          await loadTasks()
          follow(runId)
        }
      }

      // --- stages --------------------------------------------------------------
      /**
       * The stage editor.
       *
       * Held as an array in `state.stages` and written whole, which mirrors how a template is
       * stored: the order *is* the array, so a move is a splice rather than a renumbering that
       * could disagree with itself.
       */
      state.stages = []
      state.stageSource = null

      /**
       * `keepOpen` is the template the editor should still be showing afterwards.
       *
       * Without it a reload after "Save as" put the picker back on the default, so the template
       * someone had just created vanished from under them the moment it was saved.
       */
      async function loadStages({ keepOpen } = {}) {
        const res = await fetch('/api/stage-templates')
        if (!res.ok) return
        const body = await res.json()
        state.stages = body.effective.stages.map((s) => ({ ...s }))
        // Kept so opening the dialog for a task can start from what that task would run.
        state.projectStages = body.effective.stages
        state.stageSource = body.effective.source
        state.stageTaskId = null
        state.wellKnownStages = body.wellKnown ?? []
        /**
         * Every saved template, not only the one in effect.
         *
         * The list was fetched and thrown away, which is why the editor could reach exactly one
         * of them: whatever `effective` happened to be.
         */
        state.templates = body.templates ?? []
        state.openTemplateId =
          (keepOpen && state.templates.find((t) => t.id === keepOpen)?.id) ??
          state.templates.find((t) => t.name === body.effective.name)?.id ??
          null
        /**
         * Which template is in effect, kept apart from which one is open.
         *
         * They are the same until someone switches the picker, and conflating them is what let
         * a closed-without-saving switch leave the sidebar button opening the wrong template.
         */
        state.effectiveTemplateId =
          state.templates.find((t) => t.name === body.effective.name)?.id ?? null
        state.effectiveTemplateName =
          body.effective.source === 'built-in' ? '' : body.effective.name

        const open = state.templates.find((t) => t.id === state.openTemplateId)
        if (open) {
          // The editor shows the template the picker names, which for `keepOpen` is not the one
          // in effect — reading the stages off `effective` there would show the wrong pipeline.
          state.stages = open.stages.map((stage) => ({ ...stage }))
        }
        $('stageTemplateName').value = open
          ? open.name
          : body.effective.source === 'built-in'
            ? ''
            : body.effective.name
        renderTemplatePicker()
        renderTaskTemplateOptions()
        renderStages()
      }

      /** A template's own name, plus what it is: a project's, the space's, the default. */
      function templateLabel(template) {
        const marks = [
          template.projectId ? 'this project' : 'shared by the space',
          ...(template.isDefault ? ['default'] : []),
        ]
        return `${template.name} — ${marks.join(', ')}`
      }

      /**
       * The picker, and the state that goes with whichever template is open.
       *
       * "New template…" is an entry rather than a separate button because creating one is the
       * same act as editing one with a different name — the alternative was a second control
       * that did what typing in the name field already does.
       */
      function renderTemplatePicker() {
        const templates = state.templates ?? []
        $('templatePicker').innerHTML = [
          ...templates.map(
            (t) =>
              `<option value="${escapeAttr(t.id)}" ${t.id === state.openTemplateId ? 'selected' : ''}>${escapeHtmlText(templateLabel(t))}</option>`,
          ),
          `<option value="" ${state.openTemplateId ? '' : 'selected'}>New template…</option>`,
        ].join('')

        const open = templates.find((t) => t.id === state.openTemplateId)
        // A template the space owns is edited from here, but deleting it would change what every
        // other project in the space inherits — so that is not a button on a project's screen.
        $('deleteTemplate').disabled = !open || !open.projectId
        $('deleteTemplate').title = open?.projectId
          ? 'Delete this template'
          : open
            ? "This one belongs to the client space — delete it where it's owned"
            : 'Nothing to delete yet'
        $('makeDefault').checked = open ? open.isDefault : templates.length === 0
      }

      /**
       * The stages a new task will run, chosen at dispatch.
       *
       * The project default is the first entry and stays selected unless someone picks
       * otherwise, so the form behaves exactly as it did for anyone who ignores this.
       */
      function renderTaskTemplateOptions() {
        const templates = state.templates ?? []
        const chosen = $('taskTemplate').value
        $('taskTemplate').innerHTML = [
          `<option value="">the project default${
            state.stageSource === 'built-in' ? ' (built-in stages)' : ''
          }</option>`,
          ...templates
            .filter((t) => !t.isDefault)
            .map(
              (t) =>
                `<option value="${escapeAttr(t.id)}">${escapeHtmlText(templateLabel(t))}</option>`,
            ),
          /**
           * A pipeline for this one task, saving nothing.
           *
           * The alternative was a template per variation: "run this one without the design
           * stage" would leave a permanent project-level profile behind, and a project would
           * collect one per task until the picker was useless.
           */
          `<option value="${CUSTOM_STAGES}">${
            state.draftStages ? describeDraft(state.draftStages) : 'custom for this task…'
          }</option>`,
        ].join('')
        // Kept across a reload, so saving a template does not quietly reset a choice made on the
        // form a moment ago.
        if (chosen) $('taskTemplate').value = chosen
      }

      /** The sentinel for "not a template at all". Not a uuid, so it cannot collide with one. */
      const CUSTOM_STAGES = 'custom'

      /** What the custom option says once there is a draft behind it. */
      function describeDraft(stages) {
        const off = stages.filter((stage) => stage.enabled === false).length
        const runs = stages.length - off
        // "3 stages, 1 off" reads as though there were three in total. Say which will run.
        return `custom — ${runs} will run${off ? `, ${off} off` : ''} (edit)`
      }

      /**
       * Choosing "custom" opens the editor rather than selecting a value.
       *
       * The stages have to exist before the task does, so this is the only point at which they
       * can be built — and building them is an edit, not a pick from a list.
       */
      $('taskTemplate').onchange = () => {
        if ($('taskTemplate').value !== CUSTOM_STAGES) return
        // Starts from what this task would have run anyway, which is nearly always the thing
        // being varied.
        state.stages = (state.draftStages ?? state.projectStages ?? []).map((stage) => ({
          ...stage,
        }))
        renderStages()
        openStageDialog({ draft: true })
      }

      /** Where the stages a new task runs came from, in words rather than a field name. */
      const SOURCE_WORDS = {
        'built-in': 'the built-in defaults — nothing has been configured yet',
        'space-default': "this client space's stages, shared by every project in it",
        'project-default': "this project's own stages",
        'task-template': 'a template chosen per task',
        'task-inline': 'stages pinned to a single task',
      }

      function renderStages() {
        $('stagesSource').textContent = state.stageSource
          ? `New tasks run ${SOURCE_WORDS[state.stageSource] ?? state.stageSource}.`
          : ''

        /**
         * The sidebar shows what will happen; the dialog is where it changes.
         *
         * An arrow-separated list is enough to answer "is the review stage still in there?"
         * without opening anything, and a mark for the stages that stop for approval, because
         * that is the one property with a cost attached.
         */
        const effective = state.projectStages ?? state.stages
        $('stagesSummary').textContent = effective.length
          ? effective.map((stage) => `${stage.id}${stage.requiresApproval ? ' ⏸' : ''}`).join(' → ')
          : 'No stages configured.'

        if (state.stages.length === 0) {
          $('stageList').innerHTML = '<p class="empty">No stages. A run would do nothing.</p>'
          return
        }

        $('stageList').innerHTML = state.stages
          .map(
            (stage, i) => `
            <div class="stage${stage.enabled === false ? ' off' : ''}" draggable="true" data-stage-index="${i}">
              <div class="stage-head">
                <!--
                  The handle is a button, not a bare grip.

                  Dragging replaced the up/down arrows, and a drag-only control cannot be
                  operated from the keyboard at all — so this one is focusable and moves the
                  stage with the arrow keys. Same affordance, both ways in.
                -->
                <button
                  type="button"
                  class="secondary icon grip"
                  data-stage-grip="${i}"
                  title="Drag to reorder, or focus and use the arrow keys"
                  aria-label="reorder ${escapeAttr(stage.id)}"
                >⋮⋮</button>
                <span class="hint">${i + 1}</span>
                <input data-stage-id="${i}" value="${escapeAttr(stage.id)}" placeholder="stage name" />
                <select data-stage-kind="${i}">
                  <option value="agent" ${stage.kind === 'agent' ? 'selected' : ''}>agent</option>
                  <option value="builtin" ${stage.kind === 'builtin' ? 'selected' : ''}>builtin</option>
                </select>
                <!--
                  Off, rather than removed.

                  Turning a stage off keeps it and its prompt in the pipeline, so putting it back
                  is a click — which is the whole point for a one-off: "run this task without the
                  design stage" should not mean retyping the design stage afterwards.
                -->
                <label class="hint toggle" title="${stage.enabled === false ? 'Skipped on this run' : 'Runs'}">
                  <input type="checkbox" data-stage-enabled="${i}" ${stage.enabled === false ? '' : 'checked'} />
                  <span>on</span>
                </label>
                <button type="button" class="secondary icon" data-stage-remove="${i}" title="remove">×</button>
              </div>
              ${
                stage.kind === 'builtin'
                  ? `<select data-stage-action="${i}" style="margin-top: 6px; width: 100%">
                       ${['git.create_branch', 'git.commit', 'github.open_pr']
                         .map(
                           (a) =>
                             `<option value="${a}" ${stage.action === a ? 'selected' : ''}>${a}</option>`,
                         )
                         .join('')}
                     </select>`
                  : `<select data-stage-tools="${i}" style="margin-top: 6px; width: 100%">
                       ${['none', 'read_only', 'full']
                         .map(
                           (m) =>
                             `<option value="${m}" ${(stage.tools?.mode ?? 'none') === m ? 'selected' : ''}>tools: ${m}</option>`,
                         )
                         .join('')}
                     </select>
                     <textarea data-stage-prompt="${i}" rows="4"
                       placeholder="what this stage should do — the instructions the model gets">${escapeHtmlText(stage.prompt ?? '')}</textarea>
                     ${
                       stage.promptFile && !stage.prompt
                         ? `<p class="hint" style="margin: 4px 0 0">
                              No instructions here — this stage reads
                              <code>${escapeHtmlText(stage.promptFile)}</code> from the image,
                              which nobody can edit. Type above to replace it.
                            </p>`
                         : ''
                     }`
              }
              <label class="hint approval">
                <input type="checkbox" data-stage-approval="${i}" ${stage.requiresApproval ? 'checked' : ''} />
                <span>Needs approval — the run stops after this stage and costs nothing until someone decides</span>
              </label>
            </div>`,
          )
          .join('')

        bindStageInputs()
      }

      /**
       * Every control writes straight into `state.stages`.
       *
       * Re-rendering on each keystroke would move the caret and lose focus, so only the controls
       * that change a stage's *shape* — its kind, or its position — redraw.
       */
      function bindStageInputs() {
        /**
         * Reading a stage out of the array, and recording that it was touched.
         *
         * Every control goes through here, so marking it in one place is what makes the
         * discard warning honest — a flag set by each handler would be forgotten by the next
         * control someone adds.
         */
        const at = (el, attr) => {
          state.stagesDirty = true
          return state.stages[Number(el.dataset[attr])]
        }

        $('stageList')
          .querySelectorAll('[data-stage-id]')
          .forEach((el) => (el.oninput = () => (at(el, 'stageId').id = el.value.trim())))
        $('stageList')
          .querySelectorAll('[data-stage-prompt]')
          .forEach((el) => (el.oninput = () => (at(el, 'stagePrompt').prompt = el.value)))
        $('stageList')
          .querySelectorAll('[data-stage-tools]')
          .forEach(
            (el) =>
              (el.onchange = () => {
                at(el, 'stageTools').tools = { mode: el.value, allow: [], deny: [] }
              }),
          )
        $('stageList')
          .querySelectorAll('[data-stage-action]')
          .forEach((el) => (el.onchange = () => (at(el, 'stageAction').action = el.value)))
        $('stageList')
          .querySelectorAll('[data-stage-approval]')
          .forEach(
            (el) => (el.onchange = () => (at(el, 'stageApproval').requiresApproval = el.checked)),
          )
        /**
         * Turning a stage off, which the engine already honours by skipping it.
         *
         * Re-rendered because the row's appearance changes — a stage that will not run has to
         * look like one, or the only evidence is a checkbox nobody scrolls back to.
         */
        $('stageList')
          .querySelectorAll('[data-stage-enabled]')
          .forEach(
            (el) =>
              (el.onchange = () => {
                at(el, 'stageEnabled').enabled = el.checked
                renderStages()
              }),
          )

        $('stageList')
          .querySelectorAll('[data-stage-kind]')
          .forEach(
            (el) =>
              (el.onchange = () => {
                const stage = at(el, 'stageKind')
                stage.kind = el.value
                // The two kinds carry different fields, and leaving the other behind produces a
                // template the schema rejects on save with a message about a field nobody set.
                if (stage.kind === 'builtin') {
                  delete stage.prompt
                  delete stage.tools
                  stage.action = stage.action ?? 'git.commit'
                } else {
                  delete stage.action
                  stage.tools = stage.tools ?? { mode: 'none', allow: [], deny: [] }
                }
                renderStages()
              }),
          )

        const move = (from, to) => {
          if (to < 0 || to >= state.stages.length || from === to) return
          state.stagesDirty = true
          const [moved] = state.stages.splice(from, 1)
          state.stages.splice(to, 0, moved)
          renderStages()
          // Focus follows the stage, so a keyboard reorder can continue rather than dumping the
          // caret back at the top of the list after every single move.
          $('stageList').querySelector(`[data-stage-grip="${to}"]`)?.focus()
        }

        /**
         * Reordering by dragging the row, with the keyboard as the equal path.
         *
         * The arrows were replaced because reordering five stages meant counting clicks. They
         * are not simply gone: the grip is focusable and takes ArrowUp/ArrowDown, because a
         * drag-only list is unusable without a mouse.
         */
        $('stageList')
          .querySelectorAll('[data-stage-grip]')
          .forEach((el) => {
            const from = Number(el.dataset.stageGrip)
            el.onkeydown = (event) => {
              const to =
                event.key === 'ArrowUp' ? from - 1 : event.key === 'ArrowDown' ? from + 1 : null
              if (to === null) return
              // The list scrolls; without this the page jumps a screen on every move.
              event.preventDefault()
              move(from, to)
            }
          })

        const rows = [...$('stageList').querySelectorAll('[data-stage-index]')]
        const clearMarks = () =>
          rows.forEach((row) => row.classList.remove('drop-before', 'drop-after', 'dragging'))

        rows.forEach((row) => {
          const index = Number(row.dataset.stageIndex)

          row.ondragstart = (event) => {
            state.dragFrom = index
            row.classList.add('dragging')
            // `setData` is required or Firefox refuses to start the drag at all; the payload is
            // the index, though the handler reads `state.dragFrom` so a drag from another window
            // cannot reorder this list.
            event.dataTransfer?.setData('text/plain', String(index))
            if (event.dataTransfer) event.dataTransfer.effectAllowed = 'move'
          }

          row.ondragover = (event) => {
            if (state.dragFrom === undefined || state.dragFrom === index) return
            // Without preventDefault the drop event never fires — the browser treats the row as
            // an invalid target and shows the "no drop" cursor.
            event.preventDefault()
            const box = row.getBoundingClientRect()
            const after = event.clientY > box.top + box.height / 2
            row.classList.remove(after ? 'drop-before' : 'drop-after')
            row.classList.add(after ? 'drop-after' : 'drop-before')
          }

          row.ondragleave = () => row.classList.remove('drop-before', 'drop-after')

          row.ondrop = (event) => {
            event.preventDefault()
            const from = state.dragFrom
            state.dragFrom = undefined
            if (from === undefined || from === index) return clearMarks()
            const box = row.getBoundingClientRect()
            const after = event.clientY > box.top + box.height / 2
            /**
             * Dropping below a row that sits *after* the one being dragged lands on `index`, not
             * `index + 1`: removing the dragged row first shifts everything below it up by one.
