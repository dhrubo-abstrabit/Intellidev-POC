             * Getting this wrong moves the stage one place too far, which looks like the drop
             * being ignored every other time.
             */
            const to = after ? (from < index ? index : index + 1) : from < index ? index - 1 : index
            clearMarks()
            move(from, to)
          }

          row.ondragend = () => {
            state.dragFrom = undefined
            clearMarks()
          }
        })
        $('stageList')
          .querySelectorAll('[data-stage-remove]')
          .forEach(
            (el) =>
              (el.onclick = () => {
                state.stagesDirty = true
                state.stages.splice(Number(el.dataset.stageRemove), 1)
                renderStages()
              }),
          )
      }

      /**
       * Opened as a modal, so the page underneath is inert while a pipeline is being edited.
       *
       * `showModal` rather than a hidden div: it traps focus, closes on Escape and dims what is
       * behind it without any of that being written here.
       */
      /**
       * One dialog, two modes, and the mode is an argument rather than leftover state.
       *
       * Both buttons used to call the same handler, so a task edit left the dialog in task mode
       * and the *sidebar* button then saved to whichever task was last selected — silently
       * writing a project change onto one task.
       */
      function openStageDialog({ taskId, draft } = {}) {
        state.stageTaskId = taskId ?? null
        state.stageDraft = Boolean(draft)
        /**
         * Three subjects, and only one of them is a template.
         *
         * A task's stages — pinned to an existing task, or drafted for one not yet created —
         * have no name of their own, belong to no template, and are not anyone's default. So
         * the name field, the picker and the default box are all a project-scope thing: showing
         * them would offer to do something the save cannot do.
         */
        const perTask = Boolean(taskId) || Boolean(draft)
        $('stageTemplateNameRow').hidden = perTask
        $('templatePickerRow').hidden = perTask
        $('makeDefaultRow').hidden = perTask
        state.stagesDirty = false
        $('stagesTitle').textContent = taskId
          ? 'Stages for this task'
          : draft
            ? 'Stages for the next task'
            : 'Project stages'
        $('stagesScopeNote').textContent = taskId
          ? 'Saved against this task only — the project default and every other task are untouched.'
          : draft
            ? 'Used by the task you are about to create. Nothing is saved as a template, and no other task changes.'
            : "Saved as this project's default. Every new task starts from it."
        $('saveStages').textContent = draft ? 'Use these stages' : 'Save'
        $('stagesStatus').textContent = ''
        /**
         * Re-synced on open, not only on load.
         *
         * The picker and the default box describe whichever template is open, and both are
         * plain form controls that keep whatever they were last set to. Opening the dialog
         * without this showed the default box unchecked for a template that *is* the default —
         * and a save would then have taken the default away.
         */
        if (!perTask) renderTemplatePicker()
        $('stagesDialog').showModal()
      }

      $('openStages').onclick = () => {
        // From the sidebar the subject is the project, so a task edited a moment ago is not it —
        // and neither is a template someone switched the picker to and then closed without
        // saving. Both the stages and the picker go back to what is in effect.
        state.stages = (state.projectStages ?? []).map((stage) => ({ ...stage }))
        state.openTemplateId = state.effectiveTemplateId ?? null
        $('stageTemplateName').value = state.effectiveTemplateName ?? ''
        renderStages()
        openStageDialog({ taskId: null })
      }
      $('closeStages').onclick = () => {
        /**
         * Backing out of a draft returns the selector to what it was.
         *
         * Otherwise the form would sit on "custom for this task…" with nothing behind it, and
         * the task would be created with the project default while the form claimed otherwise.
         */
        if (state.stageDraft && !state.draftStages) $('taskTemplate').value = ''
        $('stagesDialog').close()
      }

      /**
       * Switching which template is open.
       *
       * The editor holds a copy, so switching discards unsaved edits — confirmed rather than
       * done silently, because the stages someone just typed are not recoverable from anywhere.
       */
      $('templatePicker').onchange = () => {
        const id = $('templatePicker').value
        const target = (state.templates ?? []).find((t) => t.id === id)

        if (state.stagesDirty && !confirm('Discard the changes you have not saved?')) {
          // Put the selection back, or the box would claim to show a template it is not showing.
          renderTemplatePicker()
          return
        }

        state.openTemplateId = target?.id ?? null
        state.stagesDirty = false
        if (target) {
          state.stages = target.stages.map((stage) => ({ ...stage }))
          $('stageTemplateName').value = target.name
        } else {
          // A new template starts from what this project runs today rather than from nothing:
          // most new templates are a variation on the default, not a blank page.
          state.stages = (state.projectStages ?? []).map((stage) => ({ ...stage }))
          $('stageTemplateName').value = ''
        }
        $('stagesStatus').textContent = ''
        renderTemplatePicker()
        renderStages()
      }

      $('deleteTemplate').onclick = async () => {
        const open = (state.templates ?? []).find((t) => t.id === state.openTemplateId)
        if (!open) return
        if (!confirm(`Delete "${open.name}"? Tasks already dispatched are unaffected.`)) return

        $('deleteTemplate').disabled = true
        const res = await fetch(`/api/stage-templates/${open.id}`, { method: 'DELETE' })
        $('deleteTemplate').disabled = false
        if (!res.ok) {
          const body = await res.json().catch(() => ({}))
          $('stagesStatus').textContent = body.error ?? 'could not delete'
          return
        }
        state.openTemplateId = null
        state.stagesDirty = false
        $('stagesStatus').textContent = 'deleted'
        await loadStages()
      }

      $('addStage').onclick = () => {
        state.stagesDirty = true
        state.stages.push({
          id: `stage-${state.stages.length + 1}`,
          kind: 'agent',
          prompt: '',
          tools: { mode: 'read_only', allow: [], deny: [] },
          requiresApproval: false,
        })
        renderStages()
      }

      $('saveStages').onclick = async () => {
        /**
         * Two destinations, and the difference is the whole feature.
         *
         * With a task selected the stages are pinned to that task: the template it came from is
         * untouched, and so is every other task. Without one, this is the project's default and
         * every future task starts from it.
         */
        /**
         * A draft is kept in the page until the task is created.
         *
         * There is nothing to save it against yet — the task does not exist — and inventing a
         * template to hold it is exactly what this avoids.
         */
        if (state.stageDraft) {
          state.draftStages = state.stages.map((stage) => ({ ...stage }))
          state.stagesDirty = false
          renderTaskTemplateOptions()
          $('taskTemplate').value = CUSTOM_STAGES
          $('stagesDialog').close()
          return
        }

        if (state.stageTaskId) {
          $('saveStages').disabled = true
          const res = await fetch(`/api/tasks/${state.stageTaskId}/stages`, {
            method: 'PUT',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ stages: state.stages }),
          })
          $('saveStages').disabled = false
          const body = await res.json().catch(() => ({}))
          $('stagesStatus').textContent = res.ok
            ? 'saved for this task only'
            : `${body.error ?? 'could not save'}${body.detail ? `: ${body.detail}` : ''}`
          if (res.ok) {
            $('stagesDialog').close()
            // Re-read the task so the button says "edited" and the detail reflects the pin.
            await select(state.stageTaskId)
          }
          return
        }

        const name = $('stageTemplateName').value.trim()
        if (!name) {
          $('stagesStatus').textContent = 'give the template a name first'
          return
        }
        const open = (state.templates ?? []).find((t) => t.id === state.openTemplateId)
        /**
         * A changed name saves a new template rather than renaming the open one.
         *
         * Which makes "Save as" literal: the way to keep the original and get a variant is to
         * type a different name, and the way to edit one is to leave its name alone. Sending the
         * id whenever we have one would have made renaming the only possible outcome.
         */
        const editingSameName = open && open.name === name

        $('saveStages').disabled = true
        const res = await fetch('/api/stage-templates', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            ...(editingSameName ? { id: open.id } : {}),
            name,
            stages: state.stages,
            // Space-level templates are a deliberate act, not a side effect of editing here.
            scope: 'project',
            // Asked rather than assumed: this is the one field that changes what every future
            // task runs, and it used to be set on every save.
            isDefault: $('makeDefault').checked,
          }),
        })
        $('saveStages').disabled = false
        const body = await res.json().catch(() => ({}))
        $('stagesStatus').textContent = res.ok
          ? $('makeDefault').checked
            ? 'saved — new tasks in this project will run these stages'
            : 'saved — pick it under Stages when creating a task'
          : `${body.error ?? 'could not save'}${body.detail ? `: ${body.detail}` : ''}`
        if (res.ok) {
          // Reopened on what was just saved, so a "Save as" leaves the editor showing the new
          // template rather than jumping back to whichever one is the default.
          state.stagesDirty = false
          await loadStages({ keepOpen: body.template?.id })
          // Closed on success only. A failed save keeps the dialog open with the message beside
          // the button, rather than dismissing the work someone just did.
          $('stagesDialog').close()
        }
      }

      function escapeAttr(value) {
        return String(value).replace(/"/g, '&quot;').replace(/</g, '&lt;')
      }
      function escapeHtmlText(value) {
        return String(value).replace(/</g, '&lt;').replace(/>/g, '&gt;')
      }

      // --- live stream ---------------------------------------------------------
      /**
       * Server-sent events read over `fetch`, not through `EventSource`.
       *
       * `EventSource` cannot set request headers, so it cannot present a bearer token — every
       * connection came back 401 the moment the API was gated, and the only symptom was
       * "stream interrupted — reconnecting…" forever while the run itself was fine.
       *
       * The token deliberately does not go in the query string instead. A URL is not a private
       * place: it lands in load balancer access logs, in browser history, and in any referrer
       * the page emits. A header is the only place a credential belongs.
       *
       * Reconnection is ours to do now, which `EventSource` handled — and it is the reason
       * `since` exists, so a resumed stream continues from the last sequence seen rather than
       * replaying or skipping.
       */
      function follow(runId) {
        closeStream()
        state.run = runId
        state.lastSeq = -1

        const controller = new AbortController()
        state.stream = controller

        void (async () => {
          // Backoff, so a control plane that is down is not hammered by a page left open.
          let delay = 500
          while (!controller.signal.aborted) {
            try {
              const res = await fetch(`/api/runs/${runId}/stream?since=${state.lastSeq}`, {
                headers: { accept: 'text/event-stream' },
                signal: controller.signal,
              })
              if (!res.ok) throw new Error(`stream returned ${res.status}`)
              delay = 500

              const reader = res.body.getReader()
              const decoder = new TextDecoder()
              let buffer = ''
              for (;;) {
                const { value, done } = await reader.read()
                if (done) break
                buffer += decoder.decode(value, { stream: true })
                // Frames are separated by a blank line; a partial one stays in the buffer.
                const frames = buffer.split('\n\n')
                buffer = frames.pop() ?? ''
                for (const frame of frames) {
                  const data = frame
                    .split('\n')
                    .filter((l) => l.startsWith('data:'))
                    .map((l) => l.slice(5).trim())
                    .join('\n')
                  if (!data) continue
                  const event = JSON.parse(data)
                  state.lastSeq = event.seq
                  render(event)
                  if (event.type === 'run.finished') {
                    closeStream()
                    await loadTasks()
                    return
                  }
                }
              }
            } catch (error) {
              if (controller.signal.aborted) return
              append('warn', `stream interrupted — reconnecting… (${error.message})`)
            }
            if (controller.signal.aborted) return
            await new Promise((r) => setTimeout(r, delay))
            delay = Math.min(delay * 2, 10_000)
          }
        })()
      }

      function closeStream() {
        state.stream?.abort()
        state.stream = null
      }

      /**
       * A run that stopped for approval.
       *
       * Rendered from the event rather than by polling: `approval.requested` arrives on the same
       * stream everything else does, and the container has already exited by the time it lands —
       * which is the point. Nothing is running while this sits on screen.
       */
      function renderApproval(event) {
        const box = document.createElement('div')
        box.className = 'card'
        box.style.marginTop = '10px'
        box.innerHTML = `
          <div class="name">Waiting for approval</div>
          <p class="hint">${escapeHtmlText(event.data.detail ?? event.data.action ?? '')}</p>
          <div class="row" style="margin-top: 8px">
            <button type="button" id="approveRun">Approve and continue</button>
            <button type="button" id="rejectRun" class="secondary">Reject</button>
          </div>
          <p class="hint" id="approvalStatus"></p>`
        $('detail').append(box)

        const decide = async (decision) => {
          $('approveRun').disabled = true
          $('rejectRun').disabled = true
          const res = await fetch(`/api/runs/${state.run}/decision`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ decision }),
          })
          const body = await res.json().catch(() => ({}))
          if (!res.ok) {
            $('approvalStatus').textContent = body.error ?? 'could not record that'
            $('approveRun').disabled = false
            $('rejectRun').disabled = false
            return
          }
          $('approvalStatus').textContent =
            decision === 'approved' ? 'approved — resuming…' : 'rejected'
          // Approving starts a new container for the same run, so the stream is re-followed
          // rather than the page reloaded: the events continue where they left off.
          if (decision === 'approved') follow(state.run)
          await loadTasks()
        }
        $('approveRun').onclick = () => void decide('approved')
        $('rejectRun').onclick = () => void decide('rejected')
      }

      const stageEls = new Map()
      function render(event) {
        if (event.type === 'approval.requested') renderApproval(event)
        if (event.type === 'stage.entered') markStage(event.stage, 'active')
        if (event.type === 'stage.exited') markStage(event.stage, event.data.outcome)
        const line = describe(event)
        if (line)
          append(
            line.cls,
            `${String(event.seq).padStart(4, '0')} ${event.stage ?? '·'} ${line.text}`,
          )
      }

      function markStage(stage, cls) {
        if (!stage) return
        let el = stageEls.get(stage)
        if (!el) {
          el = document.createElement('span')
          el.className = 'stage'
          el.textContent = stage
          $('stages')?.appendChild(el)
          stageEls.set(stage, el)
        }
        el.className = `stage ${cls}`
      }

      function describe(e) {
        const d = e.data ?? {}
        switch (e.type) {
          case 'assistant.delta':
            return null
          case 'command.output':
            return null
          case 'run.provisioning':
            return { cls: '', text: 'provisioning' }
          case 'cache.restored':
            return { cls: '', text: `cache ${d.hit ? 'hit' : 'miss'} (${d.durationMs}ms)` }
          case 'worktree.ready':
            return { cls: '', text: `worktree ${d.branch} @ ${d.baseSha.slice(0, 8)}` }
          case 'run.started':
            return { cls: 'ok', text: `started with ${d.harness}` }
          case 'stage.entered':
            return { cls: 'st', text: `── attempt ${d.attempt}` }
          case 'stage.exited':
            return { cls: d.outcome === 'passed' ? 'ok' : 'bad', text: `   ${d.outcome}` }
          case 'assistant.message':
            return { cls: '', text: `say: ${firstLine(d.text)}` }
          case 'thinking.started':
            return { cls: '', text: 'thinking' }
          case 'tool.call':
            return { cls: '', text: `→ ${d.name} ${firstLine(d.inputPreview ?? '')}` }
          case 'tool.result':
            return { cls: d.ok ? '' : 'bad', text: `← ${d.name} ${d.ok ? 'ok' : 'FAILED'}` }
          case 'tool.denied':
            return { cls: 'warn', text: `⊘ ${d.name} denied: ${d.reason}` }
          case 'seat.authenticated':
            return {
              cls: 'ok',
              text: `seat ${d.harness} authenticated${d.envVars.length ? ` via ${d.envVars.join(', ')}` : ''}${d.files.length ? ` (${d.files.length} credential file)` : ''}`,
            }
          case 'tool.server_connected':
            return {
              cls: 'ok',
              text: `mcp ${d.name} connected${d.authenticated ? ' (authenticated)' : ''}: ${d.tools.join(', ') || 'no tools'}`,
            }
          case 'file.changed':
            return { cls: '', text: `${d.change} ${d.path}` }
          case 'diff.produced':
            return {
              cls: '',
              text: `diff ${d.filesChanged} files +${d.insertions}/-${d.deletions}`,
            }
          case 'gate.evaluated':
            return {
              cls: d.passed ? 'ok' : 'bad',
              text: `gate ${d.passed ? 'PASS' : 'FAIL'} ${d.label ?? d.kind}`,
            }
          case 'gate.blocked':
            return {
              cls: 'warn',
              text: `blocked ${d.attemptsUsed}/${d.attemptsAllowed} → ${d.nextStage ?? 'fail'}`,
            }
          case 'git.branch_created':
            return { cls: '', text: `branch ${d.branch}` }
          case 'git.committed':
            return { cls: 'ok', text: `commit ${d.sha.slice(0, 8)}` }
          case 'git.pushed':
            return { cls: 'ok', text: `pushed ${d.branch}` }
          case 'pr.opened':
            return { cls: 'ok', text: `PR #${d.number} ${d.url}` }
          // Labelled as an estimate, because for seat auth it is derived rather than billed.
          case 'usage.updated':
            return { cls: '', text: `usage ~${d.tokensIn} in / ${d.tokensOut} out` }
          case 'error':
            return { cls: 'bad', text: `ERROR ${d.code}: ${firstLine(d.message)}` }
          case 'harness.crashed':
            return { cls: 'bad', text: `harness crashed (${d.exitCode ?? d.signal})` }
          case 'run.finished':
            return {
              cls: d.outcome === 'succeeded' ? 'ok' : 'bad',
              text: `── ${d.outcome}${d.reason ? `: ${d.reason}` : ''}`,
            }
          default:
            return { cls: '', text: e.type }
        }
      }

      function append(cls, text) {
        const log = $('log')
        if (!log) return
        const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40
        const span = document.createElement('span')
        span.className = cls
        span.textContent = text + '\n'
        log.appendChild(span)
        // Only follow the tail if the reader was already there; yanking the scroll away
        // from someone reading history is worse than not following.
        if (atBottom) log.scrollTop = log.scrollHeight
      }

      const firstLine = (t = '', max = 110) => {
        const line = String(t).split('\n')[0]
        return line.length > max ? line.slice(0, max) + '…' : line
      }
      function escape(text) {
        const el = document.createElement('span')
        el.textContent = String(text ?? '')
        return el.innerHTML
      }

      await loadSeats()
      await loadServers()
      await loadStages()
      await loadTasks()
    </script>
  </body>
</html>
