<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intellidev · dispatch</title>
    <!--
      Design tokens lifted from Intellidev.html, the existing UI build. Same names, same
      values, both themes — so when the real UI takes over there is nothing to reconcile.
      Fonts fall back to system faces: Manrope and JetBrains Mono are not vendored here.
    -->
    <style>
      :root {
        --app: #ffffff; --main: #ffffff; --panel: #fafbfa; --card: #ffffff;
        --inset: #f5f7f5; --field: #f5f7f5; --input: #f2f5f2; --chip: #f2f5f2;
        --hover: #f1f4f1; --active: #e9f1eb; --btn2: #f0f4f1; --btn2h: #e4ece7;
        --bd-soft: #e9ede9; --bd-strong: #ccd5ce; --bd-hover: #a5b6aa; --bd-input: #d8dfd9;
        --bd-danger: #f0c8c4; --bd-warn: #e9d9a6;
        --fg: #10201a; --fg2: #31403a; --fg3: #56655d; --fg4: #697870;
        --green: #12915a; --green2: #0f7a4b; --green-bd: #2f7d4f; --on-green: #ffffff;
        --amber: #b06a08; --blue: #2563eb; --red: #d13b3b;
        --sans: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      :root[data-theme='dark'] {
        --app: #0d100e; --main: #0c100e; --panel: #0e1210; --card: #121614;
        --inset: #0f1311; --field: #161a18; --input: #141816; --chip: #171c19;
        --hover: #191e1b; --active: #1a211d; --btn2: #1f2724; --btn2h: #28332e;
        --bd-soft: #1d2320; --bd-strong: #2a302c; --bd-hover: #3a463f; --bd-input: #262d29;
        --bd-danger: #3d2725; --bd-warn: #3a3524;
        --fg: #e6ece8; --fg2: #c6d0ca; --fg3: #9aa8a1; --fg4: #7f8a84;
        --green: #4ade80; --green2: #7dd3a0; --green-bd: #3d9a63; --on-green: #06210f;
        --amber: #f59e0b; --blue: #4c8dff; --red: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--app); color: var(--fg);
        font-family: var(--sans); font-size: 14px; line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 20px; border-bottom: 1px solid var(--bd-soft); background: var(--panel);
        position: sticky; top: 0; z-index: 5;
      }
      header h1 { font-size: 15px; margin: 0; letter-spacing: -0.01em; }
      header .spacer { flex: 1; }
      .meta { font-family: var(--mono); font-size: 11px; color: var(--fg4); }
      .layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); min-height: calc(100vh - 53px); }
      @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
      .side { border-right: 1px solid var(--bd-soft); background: var(--panel); padding: 16px; }
      .main { padding: 16px 20px; min-width: 0; }
      h2 {
        font-family: var(--mono); font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.11em; color: var(--fg3); margin: 0 0 10px;
      }
      label { display: block; font-size: 12px; color: var(--fg3); margin: 10px 0 4px; }
      input, textarea, select {
        width: 100%; padding: 8px 10px; font: inherit; color: var(--fg);
        background: var(--input); border: 1px solid var(--bd-input); border-radius: 6px;
      }
      textarea { min-height: 64px; resize: vertical; font-family: inherit; }
      input:focus, textarea:focus, select:focus { outline: 2px solid var(--green-bd); outline-offset: 1px; }
      button {
        font: inherit; font-weight: 600; padding: 9px 14px; border-radius: 6px; cursor: pointer;
        background: var(--green); color: var(--on-green); border: 1px solid var(--green-bd);
      }
      button:hover:not(:disabled) { background: var(--green2); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      button.secondary { background: var(--btn2); color: var(--fg); border-color: var(--bd-strong); }
      button.secondary:hover:not(:disabled) { background: var(--btn2h); }
      .row { display: flex; gap: 8px; align-items: center; }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
      .dot.ok { background: var(--green); }
      .dot.unauthorized { background: var(--amber); }
      .dot.error { background: var(--red); }
      .dot.unknown { background: var(--fg5); }
      .srv { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0;
             border-bottom: 1px solid var(--bd-soft); }
      .srv:last-child { border-bottom: 0; }
      .srv .grow { flex: 1; min-width: 0; }
      .srv .name { font-weight: 600; font-size: 13px; }
      .srv .meta { color: var(--fg3); font-size: 12px; margin: 2px 0 0;
                   overflow-wrap: anywhere; }
      .srv button { padding: 3px 8px; font-size: 12px; font-weight: 500; }
      .checks label { display: flex; gap: 7px; align-items: center; font-weight: 400;
                      margin: 0 0 5px; text-transform: none; letter-spacing: 0; font-size: 13px;
                      color: var(--fg); }
      .checks input { width: auto; margin: 0; }
      .card {
        background: var(--card); border: 1px solid var(--bd-soft); border-radius: 8px;
        padding: 12px; margin-bottom: 8px;
      }
      .task { cursor: pointer; }
      .task:hover { border-color: var(--bd-hover); background: var(--hover); }
      .task.selected { border-color: var(--green-bd); background: var(--active); }
      .task h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
      .task p { margin: 0; font-size: 12px; color: var(--fg3); }
      /* State is encoded in form as well as colour: a pill plus a dot, so it reads without
         relying on hue alone. */
      .pill {
        display: inline-flex; align-items: center; gap: 5px;
        font-family: var(--mono); font-size: 10px; text-transform: uppercase;
        letter-spacing: 0.07em; padding: 2px 7px; border-radius: 999px;
        background: var(--chip); border: 1px solid var(--bd-strong); color: var(--fg3);
      }
      .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .pill.running, .pill.dispatched, .pill.provisioning { color: var(--green); border-color: var(--green-bd); }
      .pill.succeeded, .pill.in_review, .pill.done { color: var(--green); border-color: var(--green-bd); }
      .pill.failed, .pill.blocked { color: var(--red); border-color: var(--bd-danger); }
      .pill.waiting_capacity, .pill.parked { color: var(--amber); border-color: var(--bd-warn); }
      .stages { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
      .stage {
        font-family: var(--mono); font-size: 11px; padding: 3px 9px; border-radius: 5px;
        background: var(--inset); border: 1px solid var(--bd-soft); color: var(--fg4);
      }
      .stage.active { border-color: var(--green-bd); color: var(--green); background: var(--active); }
      .stage.passed { color: var(--green); border-color: var(--green-bd); }
      .stage.failed { color: var(--red); border-color: var(--bd-danger); }
      #log {
        font-family: var(--mono); font-size: 11.5px; line-height: 1.65;
        background: var(--inset); border: 1px solid var(--bd-soft); border-radius: 8px;
        padding: 10px 12px; height: calc(100vh - 320px); min-height: 240px;
        overflow-y: auto; white-space: pre-wrap; word-break: break-word;
      }
      #log .seq { color: var(--fg4); }
      #log .st { color: var(--blue); }
      #log .ok { color: var(--green); }
      #log .bad { color: var(--red); }
      #log .warn { color: var(--amber); }
      .empty { color: var(--fg4); font-size: 13px; padding: 20px 0; }
      a { color: var(--green); }
      .hint { font-size: 11px; color: var(--fg4); margin-top: 6px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Intellidev</h1>
      <span class="pill" id="mode">…</span>
      <div class="spacer"></div>
      <span class="meta" id="cfg"></span>
      <button class="secondary" id="theme" title="Toggle theme">◐</button>
    </header>

    <div class="layout">
      <section class="side">
        <h2>New task</h2>
        <form id="form">
          <label for="repoUrl">Repository</label>
          <input id="repoUrl" required placeholder="/path/to/origin.git or https://github.com/me/repo" />
          <label for="title">Title</label>
          <input id="title" required placeholder="Add a hello function" />
          <label for="description">Description</label>
          <textarea id="description" required placeholder="What should change, and why."></textarea>
          <label for="criteria">Acceptance criteria (one per line)</label>
          <textarea id="criteria" placeholder="hello('world') returns a greeting"></textarea>
          <label for="harness">Harness</label>
          <select id="harness"></select>
          <label for="baseBranch">Base branch</label>
          <input id="baseBranch" value="main" />

          <label>Tools</label>
          <div id="taskServers"><p class="hint">No MCP servers connected yet.</p></div>

          <div class="row" style="margin-top: 14px">
            <button type="submit" id="create">Create task</button>
          </div>
          <p class="hint" id="formHint"></p>
        </form>

        <h2 style="margin-top: 22px">Harness accounts</h2>
        <div id="seats"><p class="empty">No harness connected.</p></div>

        <h2 style="margin-top: 22px">
          MCP servers
          <button id="addServer" class="secondary" style="float: right; padding: 4px 10px">Add</button>
        </h2>
        <div id="servers"><p class="empty">Nothing connected.</p></div>

        <form id="serverForm" hidden>
          <label for="sPreset">Preset</label>
          <select id="sPreset"></select>
          <label for="sId">Server id</label>
          <input id="sId" placeholder="supabase" />
          <label for="sName">Display name</label>
          <input id="sName" placeholder="Supabase" />
          <label for="sUrl">URL</label>
          <input id="sUrl" placeholder="https://mcp.supabase.com/mcp" />
          <label for="sAuth">Auth</label>
          <select id="sAuth">
            <option value="oauth2">OAuth (opens a consent window)</option>
            <option value="bearer">Bearer token</option>
            <option value="none">None</option>
          </select>
          <div id="sTokenRow" hidden>
            <label for="sToken">Bearer token</label>
            <input id="sToken" type="password" placeholder="stored locally, never sent to the agent" />
          </div>
          <div id="sScopeRow">
            <label for="sScope">Scopes (space separated)</label>
            <input id="sScope" placeholder="leave blank for everything the server offers" />
          </div>
          <p class="hint" id="sHint"></p>
          <div class="row" style="margin-top: 10px">
            <button type="submit" id="saveServer">Save &amp; connect</button>
            <button type="button" id="cancelServer" class="secondary">Cancel</button>
          </div>
          <p class="hint" id="serverHint"></p>
        </form>

        <h2 style="margin-top: 22px">Tasks</h2>
        <div id="tasks"><p class="empty">No tasks yet.</p></div>
      </section>

      <section class="main">
        <div id="detail"><p class="empty">Select a task, or create one.</p></div>
      </section>
    </div>

    <script type="module">
      const $ = (id) => document.getElementById(id)
      const state = {
        tasks: [], selected: null, run: null, stream: null, lastSeq: -1,
        servers: [], presets: [], accounts: [], recipes: [], config: null,
      }

      // --- theme ---------------------------------------------------------------
      $('theme').onclick = () => {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'
        document.documentElement.dataset.theme = next
        localStorage.setItem('theme', next)
      }
      document.documentElement.dataset.theme = localStorage.getItem('theme') ?? 'dark'

      // --- boot ----------------------------------------------------------------
      const config = await (await fetch('/api/config')).json()
      $('mode').textContent = config.mode
      $('mode').className = 'pill ' + (config.mode === 'docker' ? 'running' : '')
      $('cfg').textContent =
        `${config.image} · ${config.hasGithubToken ? 'github token set' : 'no github token'}`
      $('harness').innerHTML = config.harnesses
        .map((h) => `<option ${h === 'opencode' ? 'selected' : ''}>${h}</option>`)
        .join('')

      // --- tasks ---------------------------------------------------------------
      async function loadTasks() {
        state.tasks = (await (await fetch('/api/tasks')).json()).tasks
        $('tasks').innerHTML =
          state.tasks.length === 0
            ? '<p class="empty">No tasks yet.</p>'
            : state.tasks
                .map(
                  (t) => `
          <div class="card task ${state.selected === t.id ? 'selected' : ''}" data-id="${t.id}">
            <div class="row" style="justify-content: space-between">
              <h3>${escape(t.title)}</h3>
              <span class="pill ${t.status}">${t.status.replace(/_/g, ' ')}</span>
            </div>
            <p>${escape(t.harness)} · ${escape(t.repoUrl.split('/').slice(-1)[0])}${t.mcpServerIds?.length ? ` · ${escape(t.mcpServerIds.join(', '))}` : ''}</p>
          </div>`,
                )
                .join('')
        for (const el of $('tasks').querySelectorAll('.task')) {
          el.onclick = () => select(el.dataset.id)
        }
      }

      // --- harness accounts ----------------------------------------------------

      async function loadSeats() {
        const [accounts, recipes, config] = await Promise.all([
          fetch('/api/harness/accounts').then((r) => r.json()),
          state.recipes.length ? { recipes: state.recipes } : fetch('/api/harness/recipes').then((r) => r.json()),
          fetch('/api/config').then((r) => r.json()),
        ])
        state.accounts = accounts.accounts
        state.recipes = recipes.recipes
        state.config = config
        renderSeats()
      }

      function renderSeats() {
        // Every harness is listed, connected or not: a missing credential is the thing worth
        // seeing, since without it a run reaches the model layer and reports "Not logged in".
        $('seats').innerHTML = state.recipes
          .map((r) => {
            const account = state.accounts.find((a) => a.harness === r.harness)
            const viaEnv = !account && state.config?.harnessAuth?.[r.harness]
            const ok = Boolean(account) || viaEnv
            const detail = account
              ? (account.envVars.length ? account.envVars.join(', ') : account.files.join(', '))
              : viaEnv
                ? 'from the control plane environment'
                : `run: ${r.command}`
            return `
              <div class="srv">
                <span class="dot ${ok ? 'ok' : 'unknown'}"></span>
                <div class="grow">
                  <div class="name">${escape(r.harness)}</div>
                  <p class="meta">${escape(detail)}</p>
                </div>
                ${
                  r.canSignIn
                    ? `<button class="secondary" data-signin="${escape(r.harness)}">${account ? 'Sign in again' : 'Sign in'}</button>`
                    : `<button class="secondary" data-import="${escape(r.harness)}">${account ? 'Re-import' : 'Import'}</button>`
                }
                ${account ? `<button class="secondary" data-forget="${escape(r.harness)}" title="Forget">×</button>` : ''}
              </div>`
          })
          .join('')

        $('seats').querySelectorAll('[data-import]').forEach((b) => {
          b.onclick = async () => {
            const harness = b.dataset.import
            const recipe = state.recipes.find((r) => r.harness === harness)
            const path = prompt(`Import ${harness} credentials from:`, recipe.hostPath)
            if (!path) return
            b.disabled = true
            await connectHarness({ harness, path })
            b.disabled = false
          }
        })
        $('seats').querySelectorAll('[data-signin]').forEach((b) => {
          b.onclick = () => void signIn(b.dataset.signin, b)
        })
        $('seats').querySelectorAll('[data-forget]').forEach((b) => {
          b.onclick = async () => {
            await fetch(`/api/harness/accounts/${b.dataset.forget}`, { method: 'DELETE' })
            await loadSeats()
          }
        })
      }

      /**
       * Drive the harness's own login: open the vendor's page, relay the code back.
       *
       * The window is opened from the click handler's own turn, because a popup opened after an
       * await is treated as unrequested and blocked.
       */
      async function signIn(harness, button) {
        const label = button.textContent
        button.disabled = true
        button.textContent = 'starting…'
        const win = window.open('', 'intellidev-harness-login', 'width=560,height=760')

        try {
          const res = await fetch(`/api/harness/login/${harness}/start`, { method: 'POST' })
          const body = await res.json()
          if (!res.ok) {
            win?.close()
            alert(body.error ?? 'could not start sign-in')
            return
          }

          const login = body.login
          if (!login.authorizationUrl) {
            win?.close()
            alert(login.error ?? 'the CLI printed no sign-in link')
            return
          }
          if (win) win.location = login.authorizationUrl
          else window.open(login.authorizationUrl, '_blank')

          if (login.needsCode) {
            // Claude Code's flow ends on a page showing a code, which its CLI reads from stdin.
            const code = prompt('Sign in, then paste the code shown on that page:')
            if (!code) {
              await fetch('/api/harness/login/cancel', { method: 'POST' })
              return
            }
            await fetch('/api/harness/login/code', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ code }),
            })
          } else if (login.userCode) {
            alert(`Enter this code on the page that just opened:\n\n${login.userCode}`)
          }

          button.textContent = 'waiting…'
          const settled = await waitForLogin()
          if (settled?.status !== 'connected') {
            alert(settled?.error ?? 'sign-in did not complete')
          }
        } finally {
          win?.close()
          button.disabled = false
          button.textContent = label
          await loadSeats()
        }
      }

      /** Poll until the CLI exits one way or the other. */
      async function waitForLogin() {
        for (let i = 0; i < 150; i++) {
          const { login } = await (await fetch('/api/harness/login/status')).json()
          if (!login || login.status === 'connected' || login.status === 'failed') return login
          await new Promise((r) => setTimeout(r, 2000))
        }
        return null
      }

      async function connectHarness(body) {
        const res = await fetch('/api/harness/accounts', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        })
        if (!res.ok) alert((await res.json()).error ?? 'could not connect')
        await loadSeats()
      }

      // --- mcp servers ---------------------------------------------------------

      async function loadServers() {
        const [servers, presets] = await Promise.all([
          fetch('/api/mcp/servers').then((r) => r.json()),
          state.presets.length ? { presets: state.presets } : fetch('/api/mcp/presets').then((r) => r.json()),
        ])
        state.servers = servers.servers
        state.presets = presets.presets
        renderServers()
        renderTaskServers()
      }

      function renderServers() {
        const el = $('servers')
        if (!state.servers.length) {
          el.innerHTML = '<p class="empty">Nothing connected.</p>'
          return
        }
        el.innerHTML = state.servers
          .map((s) => {
            // An authorized-but-unverified server is its own state: the token exists but no
            // tool list has been proven, so the button says Verify rather than Connect.
            const needsAuth = !s.authorized
            const label = needsAuth ? (s.auth === 'oauth2' ? 'Connect' : 'Add token') : 'Verify'
            const detail = s.health === 'ok'
              ? `${s.toolCount ?? 0} tools`
              : s.lastError
                ? s.lastError.slice(0, 90)
                : s.authorized ? 'not verified yet' : 'not connected'
            return `
              <div class="srv">
                <span class="dot ${s.health}" title="${escape(s.health)}"></span>
                <div class="grow">
                  <div class="name">${escape(s.name)} <span style="color:var(--fg4);font-weight:400">${escape(s.auth)}</span></div>
                  <p class="meta">${escape(detail)}</p>
                </div>
                <button class="secondary" data-connect="${escape(s.id)}">${label}</button>
                <button class="secondary" data-remove="${escape(s.id)}" title="Remove">×</button>
              </div>`
          })
          .join('')

        el.querySelectorAll('[data-connect]').forEach((b) => {
          b.onclick = () => connectServer(b.dataset.connect, b)
        })
        el.querySelectorAll('[data-remove]').forEach((b) => {
          b.onclick = async () => {
            await fetch(`/api/mcp/servers/${b.dataset.remove}`, { method: 'DELETE' })
            await loadServers()
          }
        })
      }

      async function connectServer(id, button) {
        const server = state.servers.find((s) => s.id === id)
        // A bearer server with no token yet has nothing to connect to; reopen the form so the
        // token can be supplied, rather than failing a verify that was always going to fail.
        if (server && server.auth === 'bearer' && !server.authorized) {
          openServerForm(server)
          return
        }
        button.disabled = true
        button.textContent = '…'
        try {
          const res = await fetch(`/api/mcp/servers/${id}/connect`, { method: 'POST' })
          const body = await res.json()
          if (!res.ok) {
            $('serverHint').textContent = body.error ?? 'could not connect'
          } else if (body.kind === 'oauth') {
            // A popup, not a redirect: the board keeps its state and the callback page can
            // tell this window when consent is done.
            window.open(body.authorizationUrl, 'intellidev-oauth', 'width=560,height=760')
          }
        } finally {
          await loadServers()
        }
      }

      // The callback page posts this when the exchange finishes.
      window.addEventListener('message', (event) => {
        if (event.data?.type === 'intellidev:mcp-connected') void loadServers()
      })

      function openServerForm(server) {
        $('serverForm').hidden = false
        $('addServer').hidden = true
        $('sPreset').innerHTML =
          '<option value="">Custom…</option>' +
          state.presets.map((p) => `<option value="${escape(p.id)}">${escape(p.name)}</option>`).join('')
        $('sId').value = server?.id ?? ''
        $('sName').value = server?.name ?? ''
        $('sUrl').value = server?.url ?? ''
        $('sAuth').value = server?.auth ?? 'oauth2'
        $('sToken').value = ''
        $('sScope').value = ''
        $('sHint').textContent = ''
        $('serverHint').textContent = ''
        syncAuthRows()
      }

      function syncAuthRows() {
        const auth = $('sAuth').value
        $('sTokenRow').hidden = auth !== 'bearer'
        $('sScopeRow').hidden = auth !== 'oauth2'
      }
      $('sAuth').onchange = syncAuthRows

      $('sPreset').onchange = () => {
        const preset = state.presets.find((p) => p.id === $('sPreset').value)
        if (!preset) return
        $('sId').value = preset.id
        $('sName').value = preset.name
        $('sUrl').value = preset.url
        $('sAuth').value = preset.auth
        $('sScope').value = preset.scope ?? ''
        $('sHint').textContent = preset.hint
        syncAuthRows()
      }

      $('addServer').onclick = () => openServerForm(null)
      $('cancelServer').onclick = () => {
        $('serverForm').hidden = true
        $('addServer').hidden = false
      }

      $('serverForm').onsubmit = async (event) => {
        event.preventDefault()
        $('saveServer').disabled = true
        $('serverHint').textContent = ''
        const body = {
          id: $('sId').value.trim(),
          name: $('sName').value.trim() || $('sId').value.trim(),
          url: $('sUrl').value.trim(),
          auth: $('sAuth').value,
          ...($('sAuth').value === 'bearer' && $('sToken').value ? { token: $('sToken').value } : {}),
          ...($('sAuth').value === 'oauth2' && $('sScope').value.trim()
            ? { scope: $('sScope').value.trim() }
            : {}),
        }
        const res = await fetch('/api/mcp/servers', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        })
        $('saveServer').disabled = false
        if (!res.ok) {
          const error = await res.json()
          $('serverHint').textContent =
            (error.issues ?? []).map((i) => `${i.path.join('.')}: ${i.message}`).join('; ') ||
            error.error || 'could not save'
          return
        }
        $('serverForm').hidden = true
        $('addServer').hidden = false
        await loadServers()
        // Saving and connecting are one action: a server nobody connected is not useful, and
        // making it two clicks just invites forgetting the second.
        const row = $('servers').querySelector(`[data-connect="${body.id}"]`)
        if (row) await connectServer(body.id, row)
      }

      function renderTaskServers() {
        const usable = state.servers.filter((s) => s.authorized)
        const el = $('taskServers')
        if (!usable.length) {
          el.innerHTML =
            '<p class="hint">No MCP servers connected yet — add one above to give the agent tools.</p>'
          return
        }
        el.innerHTML =
          '<div class="checks">' +
          usable
            .map(
              (s) => `<label><input type="checkbox" class="taskServer" value="${escape(s.id)}" />
                 ${escape(s.name)} <span style="color:var(--fg4)">${s.toolCount ?? 0} tools</span></label>`,
            )
            .join('') +
          '</div>'
      }

      $('form').onsubmit = async (event) => {
        event.preventDefault()
        $('create').disabled = true
        $('formHint').textContent = ''
        const body = {
          repoUrl: $('repoUrl').value.trim(),
          title: $('title').value.trim(),
          description: $('description').value.trim(),
          acceptanceCriteria: $('criteria')
            .value.split('\n')
            .map((s) => s.trim())
            .filter(Boolean),
          harness: $('harness').value,
          baseBranch: $('baseBranch').value.trim() || 'main',
        }
        body.mcpServerIds = [...document.querySelectorAll('.taskServer:checked')].map((c) => c.value)
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        })
        $('create').disabled = false
        if (!res.ok) {
          const error = await res.json()
          $('formHint').textContent = (error.issues ?? [])
            .map((i) => `${i.path.join('.')}: ${i.message}`)
            .join('; ') || 'could not create task'
          return
        }
        const { task } = await res.json()
        $('title').value = ''
        $('description').value = ''
        $('criteria').value = ''
        await loadTasks()
        select(task.id)
      }

      // --- detail --------------------------------------------------------------
      async function select(id) {
        state.selected = id
        state.run = null
        closeStream()
        await loadTasks()
        const { task, runs } = await (await fetch(`/api/tasks/${id}`)).json()
        renderDetail(task, runs)
        if (runs[0]) follow(runs[0].id)
      }

      function renderDetail(task, runs) {
        const run = runs[0]
        $('detail').innerHTML = `
          <div class="row" style="justify-content: space-between; align-items: flex-start">
            <div>
              <h2 style="margin-bottom: 6px">Task</h2>
              <div style="font-size: 16px; font-weight: 600">${escape(task.title)}</div>
              <p style="color: var(--fg3); margin: 6px 0 0; max-width: 60ch">${escape(task.description)}</p>
            </div>
            <div class="row">
              <span class="pill ${task.status}">${task.status.replace(/_/g, ' ')}</span>
              <button id="dispatch" ${task.status === 'not_started' || task.status === 'failed' ? '' : 'disabled'}>
                Dispatch
              </button>
            </div>
          </div>
          <div class="stages" id="stages"></div>
          ${run?.prUrl ? `<p><a href="${run.prUrl}" target="_blank" rel="noreferrer">${run.prUrl}</a></p>` : ''}
          ${run?.failureReason ? `<p style="color: var(--red)">${escape(run.failureReason)}</p>` : ''}
          <h2 style="margin-top: 14px">Live log ${run ? `<span class="meta">· ${run.id}</span>` : ''}</h2>
          <div id="log">${run ? '' : 'Nothing dispatched yet.'}</div>
        `
        $('dispatch').onclick = async () => {
          $('dispatch').disabled = true
          $('log').textContent = ''
          const res = await fetch(`/api/tasks/${task.id}/dispatch`, { method: 'POST' })
          if (!res.ok) {
            append('bad', `dispatch failed: ${(await res.json()).error}`)
            return
          }
          const { runId } = await res.json()
          await loadTasks()
          follow(runId)
        }
      }

      // --- live stream ---------------------------------------------------------
      function follow(runId) {
        closeStream()
        state.run = runId
        state.lastSeq = -1
        // `since` is what makes a reconnect gapless rather than a guess.
        const stream = new EventSource(`/api/runs/${runId}/stream?since=${state.lastSeq}`)
        state.stream = stream
        stream.onmessage = (message) => {
          const event = JSON.parse(message.data)
          state.lastSeq = event.seq
          render(event)
          if (event.type === 'run.finished') {
            closeStream()
            loadTasks()
          }
        }
        stream.onerror = () => append('warn', 'stream interrupted — reconnecting…')
      }

      function closeStream() {
        state.stream?.close()
        state.stream = null
      }

      const stageEls = new Map()
      function render(event) {
        if (event.type === 'stage.entered') markStage(event.stage, 'active')
        if (event.type === 'stage.exited') markStage(event.stage, event.data.outcome)
        const line = describe(event)
        if (line) append(line.cls, `${String(event.seq).padStart(4, '0')} ${event.stage ?? '·'} ${line.text}`)
      }

      function markStage(stage, cls) {
        if (!stage) return
        let el = stageEls.get(stage)
        if (!el) {
          el = document.createElement('span')
          el.className = 'stage'
          el.textContent = stage
          $('stages')?.appendChild(el)
          stageEls.set(stage, el)
        }
        el.className = `stage ${cls}`
      }

      function describe(e) {
        const d = e.data ?? {}
        switch (e.type) {
          case 'assistant.delta': return null
          case 'command.output': return null
          case 'run.provisioning': return { cls: '', text: 'provisioning' }
          case 'cache.restored': return { cls: '', text: `cache ${d.hit ? 'hit' : 'miss'} (${d.durationMs}ms)` }
          case 'worktree.ready': return { cls: '', text: `worktree ${d.branch} @ ${d.baseSha.slice(0, 8)}` }
          case 'run.started': return { cls: 'ok', text: `started with ${d.harness}` }
          case 'stage.entered': return { cls: 'st', text: `── attempt ${d.attempt}` }
          case 'stage.exited': return { cls: d.outcome === 'passed' ? 'ok' : 'bad', text: `   ${d.outcome}` }
          case 'assistant.message': return { cls: '', text: `say: ${firstLine(d.text)}` }
          case 'thinking.started': return { cls: '', text: 'thinking' }
          case 'tool.call': return { cls: '', text: `→ ${d.name} ${firstLine(d.inputPreview ?? '')}` }
          case 'tool.result': return { cls: d.ok ? '' : 'bad', text: `← ${d.name} ${d.ok ? 'ok' : 'FAILED'}` }
          case 'tool.denied': return { cls: 'warn', text: `⊘ ${d.name} denied: ${d.reason}` }
          case 'seat.authenticated': return { cls: 'ok', text: `seat ${d.harness} authenticated${d.envVars.length ? ` via ${d.envVars.join(', ')}` : ''}${d.files.length ? ` (${d.files.length} credential file)` : ''}` }
          case 'tool.server_connected': return { cls: 'ok', text: `mcp ${d.name} connected${d.authenticated ? ' (authenticated)' : ''}: ${d.tools.join(', ') || 'no tools'}` }
          case 'file.changed': return { cls: '', text: `${d.change} ${d.path}` }
          case 'diff.produced': return { cls: '', text: `diff ${d.filesChanged} files +${d.insertions}/-${d.deletions}` }
          case 'gate.evaluated': return { cls: d.passed ? 'ok' : 'bad', text: `gate ${d.passed ? 'PASS' : 'FAIL'} ${d.label ?? d.kind}` }
          case 'gate.blocked': return { cls: 'warn', text: `blocked ${d.attemptsUsed}/${d.attemptsAllowed} → ${d.nextStage ?? 'fail'}` }
          case 'git.branch_created': return { cls: '', text: `branch ${d.branch}` }
          case 'git.committed': return { cls: 'ok', text: `commit ${d.sha.slice(0, 8)}` }
          case 'git.pushed': return { cls: 'ok', text: `pushed ${d.branch}` }
          case 'pr.opened': return { cls: 'ok', text: `PR #${d.number} ${d.url}` }
          // Labelled as an estimate, because for seat auth it is derived rather than billed.
          case 'usage.updated': return { cls: '', text: `usage ~${d.tokensIn} in / ${d.tokensOut} out` }
          case 'error': return { cls: 'bad', text: `ERROR ${d.code}: ${firstLine(d.message)}` }
          case 'harness.crashed': return { cls: 'bad', text: `harness crashed (${d.exitCode ?? d.signal})` }
          case 'run.finished': return { cls: d.outcome === 'succeeded' ? 'ok' : 'bad', text: `── ${d.outcome}${d.reason ? `: ${d.reason}` : ''}` }
          default: return { cls: '', text: e.type }
        }
      }

      function append(cls, text) {
        const log = $('log')
        if (!log) return
        const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40
        const span = document.createElement('span')
        span.className = cls
        span.textContent = text + '\n'
        log.appendChild(span)
        // Only follow the tail if the reader was already there; yanking the scroll away
        // from someone reading history is worse than not following.
        if (atBottom) log.scrollTop = log.scrollHeight
      }

      const firstLine = (t = '', max = 110) => {
        const line = String(t).split('\n')[0]
        return line.length > max ? line.slice(0, max) + '…' : line
      }
      function escape(text) {
        const el = document.createElement('span')
        el.textContent = String(text ?? '')
        return el.innerHTML
      }

      await loadSeats()
      await loadServers()
      await loadTasks()
    </script>
  </body>
</html>
